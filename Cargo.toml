[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/server",
  "tools/server-packager",
  "tools/updater-verifier",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["form", "http1", "json", "tokio", "ws"] }
base64 = "0.22.1"
bytes = "1.12.1"
block2 = "0.6"
cairo-rs = { version = "0.18", features = ["png"] }
clap = { version = "4.6.2", features = ["derive", "env"] }
dirs = "6.0.0"
futures-util = { version = "0.3.33", features = ["sink"] }
flate2 = "1.1.9"
getrandom = "0.4.3"
gtk = "0.18"
hmac = "0.13.0"
httpdate = "1.0.3"
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
junction = "2.0.0"
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
libc = "0.2"
mime_guess = "2.0.5"
minisign-verify = "=0.2.5"
notify = "8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = [
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKBackForwardList",
] }
open = "5.4.0"
percent-encoding = "2.3.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
portpicker = "0.1.1"
portable-pty = "0.9.0"
process-wrap = { version = "9.1.0", features = ["tokio1"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
  "stream",
] }
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
rusqlite = { version = "0.40.1", features = ["backup", "bundled", "hooks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = "0.39.6"
subtle = "2.6.1"
tar = "0.4.46"
bibcode-server = { path = "apps/server" }
tauri = { version = "2.11.5", features = ["unstable", "devtools", "image-png"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-wdio = "=1.2.0"
tauri-plugin-wdio-webdriver = "=1.2.0"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.53.0", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.3"
tower-http = { version = "0.7.0", features = ["cors"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1.24.0", features = ["v4"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webview2-com = "0.38"
windows-sys = "0.61.2"
windows = "0.61"
x509-parser = "0.18.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.dependencies.tempfile]
version = "3.27.0"

[workspace.dependencies.rcgen]
version = "0.14.9"

[workspace.lints.rust]
warnings = "deny"

[workspace.metadata.bibcode.release-tools]
cargo-cyclonedx = "0.5.9"
cyclonedx-cli = "0.32.0"
minisign = "0.12.0"

[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
# Upstream fix for Windows reentrant keyboard/IME deadlocks; remove once Tauri uses Tao >= 0.36.
tao = { git = "https://github.com/tauri-apps/tao", rev = "c704261c519c58cfdd0bc2d58ba24e06a0b71c92" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
