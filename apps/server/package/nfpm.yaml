name: bibcode-server
arch: ${BIBCODE_SERVER_PACKAGE_ARCH}
platform: linux
version: ${BIBCODE_SERVER_PACKAGE_VERSION}
release: 1
section: devel
priority: optional
maintainer: BiBCode Maintainers <mubeda@users.noreply.github.com>
description: Native BiBCode server and version-matched web client
homepage: https://github.com/mubeda/BibCode
license: MIT
contents:
  - src: ${BIBCODE_SERVER_PACKAGE_ROOT}/bibcode
    dst: /usr/bin/bibcode
    file_info:
      mode: 0755
  - src: ${BIBCODE_SERVER_PACKAGE_ROOT}/web
    dst: /usr/share/bibcode/web
    type: tree
  - src: ${BIBCODE_SERVER_PACKAGE_ROOT}/README.md
    dst: /usr/share/doc/bibcode-server/README.md
    file_info:
      mode: 0644
  - src: ${BIBCODE_SERVER_PACKAGE_ROOT}/LICENSE
    dst: /usr/share/doc/bibcode-server/LICENSE
    file_info:
      mode: 0644
