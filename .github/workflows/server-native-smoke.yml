name: Native server build

on:
  workflow_call:
    inputs:
      release-ref:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      source-date-epoch:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      web-assets-artifact:
        required: true
        type: string
    secrets:
      WINDOWS_SIGNING_CERTIFICATE_PFX:
        required: false
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Server ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            formats: native,portable
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            formats: native,portable
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos
            formats: portable
          - runner: macos-26
            target: aarch64-apple-darwin
            platform: macos
            formats: portable
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            formats: native,portable
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            formats: native,portable
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release-ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install frozen dependencies
        run: vp install --frozen-lockfile

      - name: Align release versions
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache isolated Rust output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: server-${{ matrix.target }}-${{ inputs.source-sha }}
          workspaces: |
            . -> target

      - name: Download frozen server web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web-assets-artifact }}
          path: server-web-input

      - name: Verify frozen web source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < server-web-input/source-sha.txt)" = "${{ inputs.source-sha }}"

      - name: Install pinned Linux package tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --version 3.7.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked

      - name: Locate Windows SignTool
        if: matrix.platform == 'windows' && inputs.channel != 'unsigned-test'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $tool) { throw 'A pinned Windows SDK SignTool is required.' }
          $tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $tool.FullName /?

      - name: Import ephemeral Windows signing certificate
        if: matrix.platform == 'windows' && inputs.channel != 'unsigned-test'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_SUBJECT }}
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PFX) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_SUBJECT) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT)) {
            throw 'Signed Windows server builds require the dedicated certificate configuration.'
          }
          $temporaryPfx = Join-Path $env:RUNNER_TEMP ("bibcode-server-" + [guid]::NewGuid() + ".pfx")
          try {
            [IO.File]::WriteAllBytes(
              $temporaryPfx,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_PFX)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $temporaryPfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $expected = $env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT.Replace(' ', '').ToLowerInvariant()
            $certificate = @($imported) | Where-Object { $_.Thumbprint.ToLowerInvariant() -eq $expected }
            if (@($certificate).Count -ne 1 -or
                $certificate.Subject -ne $env:WINDOWS_SIGNING_CERTIFICATE_SUBJECT -or
                -not $certificate.HasPrivateKey -or
                $certificate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or
                $certificate.NotAfter.ToUniversalTime() -lt [DateTime]::UtcNow) {
              throw 'The imported Windows signing certificate does not match release policy.'
            }
          } finally {
            Remove-Item -LiteralPath $temporaryPfx -Force -ErrorAction SilentlyContinue
          }

      - name: Build server artifacts
        shell: bash
        env:
          WINDOWS_SIGNING_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_SUBJECT }}
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          args=(node scripts/build-server-artifact.ts
            --target "${{ matrix.target }}"
            --formats "${{ matrix.formats }}"
            --output-dir release/server-candidate
            --source-sha "${{ inputs.source-sha }}"
            --source-date-epoch "${{ inputs.source-date-epoch }}"
            --web-assets-dir server-web-input/web
            --web-assets-manifest server-web-input/web-assets.json)
          if [[ "${{ inputs.channel }}" == "unsigned-test" ]]; then
            args+=(--unsigned-test)
          fi
          "${args[@]}"

      - name: Remove ephemeral Windows signing certificate
        if: always() && matrix.platform == 'windows' && inputs.channel != 'unsigned-test'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $thumbprint = $env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT.Replace(' ', '')
          if ($thumbprint -match '^[A-Fa-f0-9]{40}$') {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload source-bound server candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-candidate-${{ inputs.source-sha }}-${{ matrix.target }}
          path: release/server-candidate/*
          if-no-files-found: error
          retention-days: 1

  mac_universal:
    name: Server universal-apple-darwin
    needs: [build]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release-ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install frozen dependencies
        run: vp install --frozen-lockfile

      - name: Align release versions
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: aarch64-apple-darwin

      - name: Download frozen server web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web-assets-artifact }}
          path: server-web-input

      - name: Download native x86_64 macOS slice
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-candidate-${{ inputs.source-sha }}-x86_64-apple-darwin
          path: macos-x86_64-candidate

      - name: Extract and verify native x86_64 slice
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < server-web-input/source-sha.txt)" = "${{ inputs.source-sha }}"
          mkdir -p macos-x86_64-slice
          tar -xzf "macos-x86_64-candidate/bibcode-server-${{ inputs.version }}-x86_64-apple-darwin.tar.gz" -C macos-x86_64-slice
          test -x macos-x86_64-slice/bin/bibcode

      - name: Assemble native universal package
        shell: bash
        run: |
          set -euo pipefail
          args=(node scripts/build-server-artifact.ts
            --target aarch64-apple-darwin
            --formats native
            --output-dir release/server-candidate
            --source-sha "${{ inputs.source-sha }}"
            --source-date-epoch "${{ inputs.source-date-epoch }}"
            --web-assets-dir server-web-input/web
            --web-assets-manifest server-web-input/web-assets.json
            --macos-other-slice macos-x86_64-slice/bin/bibcode
            --macos-other-slice-metadata "macos-x86_64-candidate/bibcode-server-${{ inputs.version }}-x86_64-apple-darwin.tar.gz.build.json")
          if [[ "${{ inputs.channel }}" == "unsigned-test" ]]; then
            args+=(--unsigned-test)
          fi
          "${args[@]}"

      - name: Upload source-bound universal candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-candidate-${{ inputs.source-sha }}-universal-apple-darwin
          path: release/server-candidate/*
          if-no-files-found: error
          retention-days: 1
