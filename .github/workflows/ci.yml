name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    # GitHub-hosted runners have fewer vCPUs than the upstream Blacksmith
    # runners, so the jobs need more headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build desktop pipeline
        run: vp run build:desktop

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Allow setup and the sequential package, Rust workspace, and SSH suites to
    # finish; the complete passing graph can exceed the former 45-minute budget.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      # One package test task at a time so rustc never competes with running
      # server or desktop suites; see the same step in release.yml.
      - name: Test
        run: vp run -r --concurrency-limit 1 test

      - name: Rust workspace tests
        run: cargo test --workspace -j 2

      # Ignored by default because it needs a fresh `bibcode`, which
      # `cargo test -p bibcode-desktop` neither builds nor checks. Only the SSH
      # hop is faked (tests/fixtures/ssh, Python 3); no host is contacted.
      - name: SSH environment integration
        run: |
          cargo build -p bibcode-server --bin bibcode -j 2
          cargo test -p bibcode-desktop --test ssh_environment -j 2 -- --ignored

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  native_desktop:
    name: Native desktop - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # Host tests, the optimized example (with dev features), and the native
    # bundle have distinct Cargo builds. Budget the complete cold sequence;
    # Intel needs additional headroom without shortening any validation phase.
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux
            target: appimage
            arch: arm64
            jobTimeoutMinutes: 120
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: appimage
            arch: x64
            jobTimeoutMinutes: 120
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            jobTimeoutMinutes: 120
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win
            target: nsis
            arch: arm64
            jobTimeoutMinutes: 120
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            jobTimeoutMinutes: 120
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
            jobTimeoutMinutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Verify toolchain versions
        run: |
          node --version
          vp --version
          rustc --version

      - name: Install frozen dependencies
        run: vp install --frozen-lockfile

      - name: Build web application
        run: vp run --filter @bibcode/web build

      - name: Test desktop Rust host
        run: vp run --filter @bibcode/desktop test

      - name: Verify macOS release exception recovery
        if: matrix.platform == 'mac'
        run: |
          rust_target="$(rustc -Vv | sed -n 's/^host: //p')"
          cargo run --release --target "$rust_target" -p bibcode-desktop --example objc_exception_probe

      - name: Test Windows desktop E2E support contracts
        if: matrix.platform == 'win'
        run: vp test run apps/desktop/e2e/support/test-project.test.ts apps/web/src/components/gitManager/gitManagerRepositoryAvailability.test.ts

      - name: Check Windows server test targets compile
        if: matrix.platform == 'win'
        run: node scripts/run-msvc.mjs cargo check -p bibcode-server --all-targets

      - name: Build native bundle without publishing
        run: >
          node scripts/build-desktop-artifact.ts
          --platform "${{ matrix.platform }}"
          --target "${{ matrix.target }}"
          --arch "${{ matrix.arch }}"
          --output-dir native-artifacts
          --verbose
