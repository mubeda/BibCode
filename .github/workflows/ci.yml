name: CI

on:
  # No `labeled` trigger: a label event would add skipped check runs under the
  # same job names, and a skipped check counts as passing. The ci:full label
  # takes effect on the next push; `gh workflow run ci.yml --ref <branch>`
  # runs everything at once.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One run per branch or pull request. Superseded pull request pushes were
# keeping full native matrices queued for hours, so they cancel. A running main
# run is not cancelled: a cancelled run saves no Rust cache, and every pull
# request restores its cache from main. GitHub still replaces a pending main
# run with a newer one, so a burst of merges runs the first and the last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    # Check no longer builds the release desktop bundle: Native desktop - Linux
    # x64 builds the shipped AppImage from the same sources, and that one step
    # took 23 of Check's 35 minutes (median of 34 green runs, 28 at p90).
    # The remaining steps took 12 minutes median and 15 at p90. On PR 177 the
    # hosted apt mirror stretched the Tauri dependency install from 30 s to
    # 20-25 minutes. 15 + 26 for a slow mirror is 41; 45 leaves a cold-cache
    # clippy margin.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: rustfmt, clippy

      # Save only from main. Pull-request copies of these keys filled the
      # 10 GB Actions budget and evicted the Check and Test entries.
      # cache-on-failure publishes a compile that already ran when a later
      # step fails. A timeout cancellation still skips the post step.
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          workspaces: |
            . -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Check
        run: vp check

      - name: Check agent delivery decisions
        run: node --test scripts/check-agent-delivery.node-test.mjs

      - name: Typecheck
        run: vpr typecheck

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check production server without dev features
        run: cargo check -p bibcode-server --lib --bins -j 2

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Over 27 green runs the package suites took 42 minutes at p90 and the
    # duplicate workspace-wide cargo test pass removed below another 21-23.
    # Setup, SSH, and the updater verifier add about 3. PR 65's apt stall
    # added 21 minutes. 42 + 3 + 21 is 66, so 70.
    timeout-minutes: 70
    # The two Rust suites link about 40 test binaries of 250 MB each, 17 GB of
    # target with debug info already off. Half of each binary is its symbol
    # table, so stripping it saves about 5 GB; PR 301's Test still hit ENOSPC
    # without it. Panic locations and the profiler tests' module, offset, and
    # debug ID checks do not need symbols.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: symbols
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"/CodeQL
          sudo docker image prune -af || true
          df -h /
          avail_kib=$(df -Pk / | awk 'NR==2 {print $4}')
          if (( avail_kib < 30 * 1024 * 1024 )); then
            echo "::error::Less than 30 GiB free on / after cleanup (${avail_kib} KiB available)"
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      # Save only from main. Pull-request copies of these keys filled the
      # 10 GB Actions budget and evicted the Check and Test entries.
      # cache-on-failure publishes a compile that already ran when a later
      # step fails. A timeout cancellation still skips the post step.
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          workspaces: |
            . -> target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      # One package test task at a time so rustc never competes with running
      # server or desktop suites; see the same step in release.yml.
      - name: Test
        run: vp run -r --concurrency-limit 1 test

      # Headroom record for the next ENOSPC. Skipped if the runner itself dies.
      - name: Disk usage after Test
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

      # `vp run -r test` above already runs the bibcode-server and
      # bibcode-desktop suites. The updater verifier is the only workspace
      # member without a package test task. A full workspace cargo test
      # rebuilt and reran both suites under different features: about 21
      # minutes, and a third target tree that ran the runner out of disk.
      - name: Updater verifier tests
        run: cargo test -p bibcode-updater-verifier -j 2

      # Ignored by default because it needs a fresh `bibcode`, which
      # `cargo test -p bibcode-desktop` neither builds nor checks. Only the SSH
      # hop is faked (tests/fixtures/ssh, Python 3); no host is contacted.
      - name: SSH environment integration
        run: |
          cargo test -p bibcode-server --test cli_smoke --no-run -j 2
          cargo test -p bibcode-desktop --test ssh_environment -j 2 -- --ignored

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  native_desktop:
    name: Native desktop - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # Host tests, the optimized example (with dev features), and the native
    # bundle have distinct Cargo builds. Budget the complete cold sequence;
    # Intel needs additional headroom without shortening any validation phase.
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux
            target: appimage
            arch: arm64
            jobTimeoutMinutes: 120
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: appimage
            arch: x64
            jobTimeoutMinutes: 120
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            jobTimeoutMinutes: 120
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win
            target: nsis
            arch: arm64
            jobTimeoutMinutes: 120
    steps: &native_desktop_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      # Save only from main. Pull-request copies of these keys filled the
      # 10 GB Actions budget and evicted the Check and Test entries.
      # cache-on-failure publishes a compile that already ran when a later
      # step fails. A timeout cancellation still skips the post step.
      # The shared key, the symbol build below, and no job-level CARGO_* or
      # RUST* env make this key identical to release.yml build_desktop's,
      # which restores it instead of compiling cold and saves nothing.
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          workspaces: |
            . -> target

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Verify toolchain versions
        run: |
          node --version
          vp --version
          rustc --version

      - name: Install frozen dependencies
        run: vp install --frozen-lockfile

      - name: Build web application
        run: vp run --filter @bibcode/web build

      - name: Test desktop Rust host
        run: vp run --filter @bibcode/desktop test

      # The release symbol profile, as the bundle build below uses, so the
      # dependencies both builds share compile once instead of once per
      # profile. Strip and debug info do not change the unwinding it probes.
      - name: Verify macOS release exception recovery
        if: matrix.platform == 'mac'
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        run: |
          rust_target="$(rustc -Vv | sed -n 's/^host: //p')"
          cargo run --release --target "$rust_target" -p bibcode-desktop --example objc_exception_probe

      - name: Test Windows desktop E2E support contracts
        if: matrix.platform == 'win'
        run: vp test run apps/desktop/e2e/support/test-project.test.ts apps/web/src/components/gitManager/gitManagerRepositoryAvailability.test.ts

      - name: Check Windows server test targets compile
        if: matrix.platform == 'win'
        run: node scripts/run-msvc.mjs cargo check -p bibcode-server --all-targets

      # build-desktop-artifact.ts --symbols runs dump_syms on the unstripped binary. Rust Cache
      # keeps ~/.cargo/bin, so a restored runner skips the compile.
      - name: Install dump_syms
        run: node scripts/run-msvc.mjs cargo install dump_syms --locked --version 2.3.9

      # --symbols is the release build (release.yml build_desktop): the same
      # profile, so the cache it saves is the one Release restores.
      - name: Build native bundle without publishing
        run: >
          node scripts/build-desktop-artifact.ts
          --platform "${{ matrix.platform }}"
          --target "${{ matrix.target }}"
          --arch "${{ matrix.arch }}"
          --output-dir native-artifacts
          --symbols
          --verbose

  # The macOS legs take 1-4 hours on a 5-job macOS concurrency cap, so pull
  # requests skip them unless labelled ci:full. Main pushes and manual runs
  # always build them. Same steps as native_desktop.
  native_desktop_macos:
    name: Native desktop - ${{ matrix.label }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            jobTimeoutMinutes: 240
          # The release producer's runner (release.yml), so the Intel build
          # this tests and the cache it saves are the ones Release uses.
          # Seeded upgrade keeps macos-26-intel for newest-OS runtime coverage.
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            jobTimeoutMinutes: 240
    steps: *native_desktop_steps

  # A real native crash under the crash monitor on every OS, symbolicated with symbols dumped
  # the way the release pipeline dumps them.
  # macos-26 runs on main, manual runs, and ci:full pull requests only.
  crash-smoke:
    name: Crash smoke - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # With the shipped thin-LTO single-unit profile, macos-26 reached the old
    # 90-minute limit and ubuntu took 26 minutes with a warm cache. A cold
    # `cargo test --release --no-run` of crash_smoke on 4 cores took 666 s
    # with that profile and 293 s with the LTO-off, 16-unit one below (2.3x).
    # 90 / 2.3 is about 40 for macOS; 60 leaves room for a cold cache.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '["ubuntu-24.04", "windows-2025", "macos-26"]' || '["ubuntu-24.04", "windows-2025"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node runs dump-symbols.ts, which needs no workspace dependencies.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          workspaces: |
            . -> target

      # Rust Cache keeps ~/.cargo/bin, so a restored runner skips both compiles. Bash, because
      # the Windows default (pwsh) only fails a step on its last command's exit code.
      - name: Install pinned symbol tools
        shell: bash
        run: |
          node scripts/run-msvc.mjs cargo install dump_syms --locked --version 2.3.9
          node scripts/run-msvc.mjs cargo install minidump-stackwalk --locked --version 0.27.0

      # The release symbol profile from release.yml: unstripped, with line tables, a dSYM on
      # macOS and a GNU build-id on Linux. CRASH_SMOKE_OUT keeps the dump after the test.
      # LTO off and 16 codegen units: the shipped thin-LTO single unit kept macos-26 on one
      # core. The planted frames are #[inline(never)], and the symbol format, line tables and
      # unwind tables do not depend on either setting. The step logs its elapsed seconds.
      - name: Crash the smoke binary
        shell: bash
        env:
          CRASH_SMOKE_OUT: ${{ runner.temp }}/crash-smoke
        run: |
          set -euo pipefail
          export CARGO_PROFILE_RELEASE_STRIP=none CARGO_PROFILE_RELEASE_DEBUG=line-tables-only
          export CARGO_PROFILE_RELEASE_LTO=off CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          case "$RUNNER_OS" in
            Linux) export RUSTFLAGS="-C link-arg=-Wl,--build-id=sha1" ;;
            macOS) export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed ;;
          esac
          start=$SECONDS
          trap 'echo "::notice title=Crash step::${RUNNER_OS} cargo test took $((SECONDS - start)) s"' EXIT
          node scripts/run-msvc.mjs cargo test -p bibcode-server --test crash_smoke --release

      - name: Symbolicate the dump
        shell: bash
        env:
          CRASH_SMOKE_OUT: ${{ runner.temp }}/crash-smoke
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Bash globs treat the backslashes of a Windows runner.temp as escapes.
          out="${CRASH_SMOKE_OUT//\\//}"
          case "$RUNNER_OS" in
            Linux)
              # The 20-byte (sha1) GNU build-id that the release RUSTFLAGS ask the linker for.
              notes="$(readelf -n target/release/crash-smoke)"
              if ! grep -Eq 'Build ID: [0-9a-f]{40}$' <<< "$notes"; then
                echo "crash-smoke has no 20-byte GNU build-id." >&2
                exit 1
              fi
              symbols=(--binary target/release/crash-smoke --module-name crash-smoke)
              ;;
            macOS) symbols=(--binary target/release/crash-smoke --module-name crash-smoke --dsym target/release/crash-smoke.dSYM) ;;
            Windows) symbols=(--binary target/release/crash-smoke.exe --module-name crash-smoke.exe --pdb target/release/crash_smoke.pdb) ;;
          esac
          node scripts/dump-symbols.ts "${symbols[@]}" --out "$out/symbols"
          # The smoke test uses CRASH_SMOKE_OUT as a data root, as `bibcode profiler` reads one.
          dumps=("$out"/userdata/profiler/crashes/*.dmp)
          if (( ${#dumps[@]} != 1 )); then
            printf 'Expected one minidump in %s/userdata/profiler/crashes, found %s.\n' "$out" "${#dumps[@]}" >&2
            exit 1
          fi
          # The test already ran `bibcode profiler symbolicate` on this dump; minidump-stackwalk
          # also reports each frame's trust, which proves the CFI unwind below.
          minidump-stackwalk --json "${dumps[0]}" "$out/symbols" > "$out/stackwalk.json"
          grep -q crash_here_in_named_function "$out/stackwalk.json"
          # The caller must be found through the STACK CFI records, not only named.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const walk = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const [crash, caller] = walk.crashing_thread.frames;
            // Symbols dumped from a PDB name a function with its parameter list.
            const name = (frame) => frame?.function?.replace(/\(\)$/, "");
            if (
              name(crash) !== "crash_smoke::crash_here_in_named_function" ||
              name(caller) !== "crash_smoke::main" ||
              caller?.trust !== "cfi"
            ) {
              console.error("Unexpected crashing frames:", JSON.stringify([crash, caller], null, 2));
              process.exit(1);
            }
          ' "$out/stackwalk.json"
          # BiBCode's own symbolication must name the planted function from the same store
          # (on Windows laid out as crash_smoke.pdb/<debug id>/crash_smoke.sym), with the
          # bibcode binary the crash step's release build made.
          bibcode=target/release/bibcode
          if [[ "$RUNNER_OS" == Windows ]]; then bibcode+=.exe; fi
          "$bibcode" profiler symbolicate "$(basename "${dumps[0]}" .dmp)" \
            --symbols "$out/symbols" --json --base-dir "$out" > "$out/symbolicate.json"
          grep -q crash_here_in_named_function "$out/symbolicate.json"

      - name: Upload crash smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/crash-smoke
          if-no-files-found: ignore
