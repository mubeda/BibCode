name: Packaged Desktop UI Smoke

on:
  workflow_dispatch:
    inputs:
      native_sharing:
        description: Qualify only the existing native sharing rows
        type: boolean
        default: false
  workflow_call:
    inputs:
      native_sharing:
        description: Qualify only the existing native sharing rows
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop_ui_smoke:
    if: ${{ !inputs.native_sharing }}
    name: Desktop UI - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            bundle: appimage
            rustTarget: aarch64-unknown-linux-gnu
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            bundle: appimage
            rustTarget: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
            bundle: nsis
            rustTarget: x86_64-pc-windows-msvc
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win
            arch: arm64
            bundle: nsis
            rustTarget: aarch64-pc-windows-msvc
          - label: macOS arm64
            runner: macos-26
            platform: mac
            arch: arm64
            bundle: dmg
            rustTarget: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            arch: x64
            bundle: dmg
            rustTarget: x86_64-apple-darwin
    env:
      BIBCODE_E2E_PLATFORM: ${{ matrix.platform }}
      BIBCODE_E2E_ARCH: ${{ matrix.arch }}
      BIBCODE_E2E_BUNDLE: ${{ matrix.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: Install Linux desktop automation dependencies
        if: matrix.platform == 'linux'
        run: &linux_desktop_dependencies |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf \
            xvfb \
            xdotool

      - name: Install frozen dependencies
        run: vp install --frozen-lockfile

      - name: Build packaged test application
        run: vp run --filter @bibcode/desktop test:ui:build

      - name: Resolve Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          app_path="$(find "$GITHUB_WORKSPACE/target/${{ matrix.rustTarget }}/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$app_path"
          chmod +x "$app_path"
          echo "BIBCODE_E2E_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Verify Linux AppImage portability
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          extract_directory="$(mktemp -d)"
          cleanup() {
            rm -rf "$extract_directory"
          }
          trap cleanup EXIT

          (
            cd "$extract_directory"
            "$BIBCODE_E2E_APP_PATH" --appimage-extract >/dev/null
          )

          forbidden_library="$(
            find "$extract_directory/squashfs-root/usr" \
              \( -type f -o -type l \) \
              -name 'libwayland-client.so*' \
              -print -quit
          )"
          if [[ -n "$forbidden_library" ]]; then
            printf 'Linux AppImage contains a bundled Wayland client: %s\n' \
              "$forbidden_library" >&2
            exit 1
          fi

      - name: Install macOS application from DMG build
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          dmg_path="$(find "target/${{ matrix.rustTarget }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_point="$RUNNER_TEMP/bibcode-desktop-ui-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -mountpoint "$mount_point" -nobrowse -readonly
          echo "BIBCODE_E2E_DMG_MOUNT_POINT=$mount_point" >> "$GITHUB_ENV"
          mounted_app="$(find "$mount_point" -maxdepth 1 -name 'BiBCode.app' -print -quit)"
          test -n "$mounted_app"
          install_directory="$(mktemp -d "$RUNNER_TEMP/bibcode-ui-install.XXXXXX")"
          echo "BIBCODE_E2E_INSTALL_DIRECTORY=$install_directory" >> "$GITHUB_ENV"
          app_path="$install_directory/BiBCode.app"
          ditto "$mounted_app" "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$mounted_app/Contents/Info.plist")"
          cmp "$mounted_app/Contents/MacOS/$executable" "$app_path/Contents/MacOS/$executable"
          codesign --verify --deep --strict "$app_path"
          echo "BIBCODE_E2E_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Install and resolve Windows NSIS application
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.rustTarget }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced." }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $allowedNames = @("BiBCode.exe", "bibcode-desktop.exe")
          $app = Get-ChildItem $env:LOCALAPPDATA -File -Recurse |
            Where-Object { $allowedNames -contains $_.Name } |
            Select-Object -First 1
          if ($null -eq $app) { throw "NSIS-installed BiBCode executable was not found." }
          "BIBCODE_E2E_APP_PATH=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run packaged desktop UI smoke
        shell: bash
        env:
          BIBCODE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/bibcode-desktop-ui-artifacts
        run: |
          if [[ "$BIBCODE_E2E_PLATFORM" == "linux" ]]; then
            xvfb-run --auto-servernum vp run test:ui:desktop
          else
            vp run test:ui:desktop
          fi

      - name: Collect macOS application crash summaries
        if: always() && matrix.platform == 'mac'
        shell: bash
        env:
          BIBCODE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/bibcode-desktop-ui-artifacts
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          directory = Path.home() / "Library/Logs/DiagnosticReports"
          paths = sorted(set(directory.glob("bibcode-desktop*.ips")) | set(directory.glob("BiBCode*.ips")), key=lambda path: path.stat().st_mtime)[-10:]
          summaries = []
          for path in paths:
              try:
                  if path.stat().st_size > 8 * 1024 * 1024:
                      raise ValueError("Crash report exceeds the bounded 8 MiB reader")
                  raw = path.read_text()
                  decoder = json.JSONDecoder()
                  records = []
                  while raw.strip():
                      record, end = decoder.raw_decode(raw.lstrip())
                      records.append(record)
                      raw = raw.lstrip()[end:]
                  report = records[-1]
                  exception = report.get("exception", {})
                  termination = report.get("termination", {})
                  thread = report.get("faultingThread")
                  threads = report.get("threads", [])
                  frames = threads[thread].get("frames", []) if isinstance(thread, int) and 0 <= thread < len(threads) else []
                  summaries.append({
                      "report": path.name,
                      "process": report.get("procName"),
                      "captureTime": report.get("captureTime"),
                      "exception": {key: exception[key] for key in ("type", "signal", "subtype", "codes") if key in exception},
                      "termination": {key: termination[key] for key in ("namespace", "code", "indicator") if key in termination},
                      "symbols": [frame.get("symbol", "<no symbol>") for frame in frames[:20]],
                  })
              except (OSError, ValueError, KeyError, TypeError, IndexError, AttributeError) as error:
                  summaries.append({"report": path.name, "error": str(error)})
          output = Path(os.environ["BIBCODE_E2E_ARTIFACT_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "native-crashes.log").write_text(json.dumps(summaries, indent=2) + "\n")
          print(json.dumps(summaries, indent=2))
          PYTHON

      - name: Unmount macOS test application
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: hdiutil detach "$BIBCODE_E2E_DMG_MOUNT_POINT"

      - name: Upload packaged desktop application
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.rustTarget }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.rustTarget }}/release/bundle/nsis/*.exe
            target/${{ matrix.rustTarget }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload desktop UI screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ui-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/bibcode-desktop-ui-artifacts/*.png
            ${{ runner.temp }}/bibcode-desktop-ui-artifacts/*.log
          if-no-files-found: warn

  native_sharing:
    name: Linux packaged native sharing in both themes
    if: ${{ inputs.native_sharing }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Install native build and private display dependencies
        run: *linux_desktop_dependencies
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Check native ownership and namespace admission
        run: |
          python3 -B scripts/qualify-chat-uploads.test.py
          python3 -B scripts/qualify-chat-network.test.py
          python3 -B scripts/qualify-native-sharing.test.py
          python3 -B scripts/qualify-chat-uploads.py preflight
          vp test run scripts/qualify-native-sharing-workflow.test.ts apps/desktop/e2e/support/release-visual-native-sharing-route.test.ts apps/desktop/e2e/support/release-visual-native-sharing-network.test.ts apps/desktop/e2e/support/release-visual-native-sharing-host.test.ts apps/desktop/e2e/support/release-visual-native-sharing-application.test.ts apps/desktop/e2e/support/release-visual-native-sharing-dom.test.ts apps/desktop/e2e/support/release-visual-native-sharing-identity.test.ts apps/desktop/e2e/support/release-visual-native-sharing-browser.test.ts apps/desktop/e2e/support/release-visual-native-sharing-navigation.test.ts apps/desktop/e2e/support/release-visual-native-sharing-session.test.ts apps/desktop/e2e/support/release-visual-native-sharing.test.ts apps/desktop/e2e/support/owned-visual-capture.test.ts apps/desktop/e2e/support/qualification-owner.test.ts
      - name: Check compiled public native sharing views
        working-directory: apps/web
        run: vp test run --project unit src/release-visual-native-sharing.public.test.tsx
      - name: Required native static gates
        run: |
          vp check
          vp run typecheck
      - name: Build guarded packaged native app
        working-directory: apps/desktop
        env:
          VITE_BIBCODE_DESKTOP_E2E: "1"
          NO_STRIP: "1"
        run: vp exec tauri build --features desktop-e2e,bibcode-server/hermetic-test-guard --config ./src-tauri/tauri.e2e.conf.json --bundles appimage --target x86_64-unknown-linux-gnu
      - name: Copy immutable native inputs
        run: |
          python3 - <<'PYTHON'
          import json, os, re, shutil
          from pathlib import Path
          version = json.loads(Path('apps/desktop/package.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise RuntimeError('Native fixture version refused')
          app = Path('target/x86_64-unknown-linux-gnu/release/bundle/appimage') / f'BiBCode_{version}_amd64.AppImage'
          if app.is_symlink() or not app.is_file() or app.stat().st_size == 0:
              raise RuntimeError('Native packaged input refused')
          target = Path(os.environ['RUNNER_TEMP']) / 'issue29-native-build'
          target.mkdir(mode=0o700)
          shutil.copy2(app, target / 'BiBCode.AppImage')
          (target / 'BiBCode.AppImage').chmod(0o500)
          PYTHON
      - name: Run contained native sharing scenes
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-native-build/BiBCode.AppImage
          BIBCODE_NATIVE_SHARING_APP: ${{ runner.temp }}/issue29-native-build/BiBCode.AppImage
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-native-sharing
      - name: Retain explicit native sharing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-native-sharing-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/owned-cleanup.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/native-share-no-route-light.png
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/native-share-no-route-dark.png
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/native-share-refresh-light.png
            ${{ runner.temp }}/issue29-native-sharing-${{ github.run_id }}/native-share-refresh-dark.png
