# Default branch registers dispatch; full capture jobs require a nominated QA ref.
name: First release visual batch (manual preparation lane)

on:
  workflow_dispatch:
    inputs:
      scene_selection:
        description: Fixed visual preparation selection
        type: choice
        required: true
        default: release-visual-core
        options:
          - release-visual-core
          - release-visual-settings
          - release-visual-git-project
          - release-visual-cursor-question
          - release-visual-workspace-substates
          - release-visual-provider-chat
          - release-visual-native-sharing
          - release-visual-native-followups
          - release-visual-project-lifecycle
          - release-visual-settings-followups
          - release-visual-pull-requests
          - release-visual-browser-followups
      import_evidence_public_spki:
        description: Optional RSA public SPKI for one encrypted owned import failure
        type: string
        default: ""
      import_evidence_public_sha256:
        description: SHA256 of the decoded public SPKI
        type: string
        default: ""

permissions:
  contents: read

jobs:
  visual_core:
    if: ${{ github.ref_name != github.event.repository.default_branch && inputs.scene_selection != 'release-visual-native-sharing' && inputs.scene_selection != 'release-visual-native-followups' }}
    name: ${{ inputs.scene_selection == 'release-visual-browser-followups' && 'Linux Chromium six browser rows in fourteen originals' || inputs.scene_selection == 'release-visual-pull-requests' && 'Linux Chromium five PR/MR rows in forty-eight originals' || inputs.scene_selection == 'release-visual-settings-followups' && 'Linux Chromium four Settings rows in eighteen originals' || inputs.scene_selection == 'release-visual-project-lifecycle' && 'Linux Chromium three project lifecycle rows in both themes' || inputs.scene_selection == 'release-visual-provider-chat' && 'Linux Chromium seven provider chat rows in both themes' || inputs.scene_selection == 'release-visual-workspace-substates' && 'Linux Chromium three existing workspace substates in both themes' || inputs.scene_selection == 'release-visual-cursor-question' && 'Linux Chromium Cursor later-question pair' || inputs.scene_selection == 'release-visual-git-project' && 'Linux Chromium Git/project partial group in both themes' || inputs.scene_selection == 'release-visual-settings' && 'Linux Chromium four settings pairs in both themes' || 'Linux Chromium eight scene pairs in both themes' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Check owned helpers and namespace admission
        run: |
          python3 -B scripts/qualify-chat-uploads.test.py
          python3 -B scripts/qualify-chat-network.test.py
          python3 -B scripts/qualify-chat-uploads.py preflight
          vp test run scripts/qualify-release-visuals-workflow.test.ts apps/desktop/e2e/support/release-visual-fixture.test.ts apps/desktop/e2e/support/release-visual-core.test.ts apps/desktop/e2e/support/git-project-tab-interception.test.ts apps/desktop/e2e/support/release-visual-git-dialog-settled.test.tsx apps/desktop/e2e/support/owned-visual-capture.test.ts apps/desktop/e2e/support/release-visual-cursor-question-fixture.test.ts apps/desktop/e2e/support/release-visual-cursor-question.test.ts apps/desktop/e2e/support/release-visual-cursor-question.public.test.ts apps/desktop/e2e/support/test-project.test.ts apps/desktop/e2e/support/release-visual-palette-readiness.test.tsx apps/desktop/e2e/support/release-visual-core-image.test.ts apps/desktop/e2e/support/release-visual-evidence.test.ts apps/desktop/e2e/support/release-visual-observation.test.ts apps/desktop/e2e/support/release-visual-boundaries.test.ts apps/desktop/e2e/support/provider-shims.test.ts apps/desktop/e2e/support/qualification-owner.test.ts apps/desktop/e2e/support/remote-ui-evidence.test.ts apps/desktop/e2e/support/delivery-retry-evidence.test.ts apps/desktop/e2e/support/delivery-retry-flow.test.ts apps/desktop/e2e/support/delivery-retry-controller.test.ts apps/desktop/e2e/support/delivery-import-observation.test.ts apps/desktop/e2e/support/delivery-retry-workspace.test.ts apps/desktop/e2e/support/browser-network.test.ts
          vp test run apps/desktop/e2e/support/release-visual-settings.test.ts apps/desktop/e2e/support/release-visual-settings-fixture.test.ts apps/desktop/e2e/support/release-visual-settings-preflight.test.ts apps/desktop/e2e/support/release-visual-settings-wiring.test.ts
          vp test run apps/desktop/e2e/support/release-visual-settings-followups.test.ts apps/desktop/e2e/support/release-visual-settings-followups-api.test.ts apps/desktop/e2e/support/release-visual-settings-followups-fixture.test.ts apps/desktop/e2e/support/release-visual-settings-followups-public.test.ts apps/desktop/e2e/support/release-visual-settings-followups-socket.test.ts apps/desktop/e2e/support/release-visual-settings-followups-transport.test.ts apps/desktop/e2e/support/release-visual-settings-followups-views.test.ts apps/desktop/e2e/support/release-visual-settings-followups-receiving.test.ts apps/desktop/e2e/support/release-visual-settings-followups-source.test.ts apps/desktop/e2e/support/release-visual-settings-followups-producer.test.ts apps/desktop/e2e/support/release-visual-settings-followups-dom.test.ts apps/desktop/e2e/support/release-visual-settings-followups-caller.test.ts
          vp test run apps/desktop/e2e/support/release-visual-git-project.test.ts apps/desktop/e2e/support/release-visual-git-project-fixture.test.ts apps/desktop/e2e/support/release-visual-git-project-directory-failure.test.ts apps/desktop/e2e/support/git-project-tab-observation.test.ts
          vp test run apps/desktop/e2e/support/release-visual-workspace-substates.test.ts
          vp test run apps/desktop/e2e/support/release-visual-provider-chat.test.ts apps/desktop/e2e/support/release-visual-provider-chat-fixture.test.ts apps/desktop/e2e/support/release-visual-provider-chat-installer.test.ts apps/desktop/e2e/support/release-visual-provider-chat-loss.test.ts apps/desktop/e2e/support/release-visual-provider-chat-api.test.ts apps/desktop/e2e/support/release-visual-provider-chat-media.test.ts apps/desktop/e2e/support/release-visual-provider-chat-turns.test.ts apps/desktop/e2e/support/release-visual-provider-chat-producer.test.ts apps/desktop/e2e/support/release-visual-provider-chat-public.test.ts apps/desktop/e2e/support/release-visual-provider-chat-wiring.test.ts
          vp test run apps/desktop/e2e/support/release-visual-project-lifecycle.test.ts apps/desktop/e2e/support/release-visual-project-lifecycle.public.test.ts apps/desktop/e2e/support/release-visual-project-lifecycle-fixture.test.ts apps/desktop/e2e/support/release-visual-project-lifecycle-api.test.ts apps/desktop/e2e/support/release-visual-project-lifecycle-wiring.test.ts apps/desktop/e2e/support/release-visual-classic-selectors.test.ts
          vp test run apps/desktop/e2e/support/release-visual-pull-requests-protocol.test.ts apps/desktop/e2e/support/release-visual-pull-requests-fixture.test.ts apps/desktop/e2e/support/release-visual-pull-requests-installer.test.ts apps/desktop/e2e/support/release-visual-pull-requests-owner.test.ts apps/desktop/e2e/support/release-visual-pull-requests-api.test.ts apps/desktop/e2e/support/release-visual-pull-requests-producer.test.ts apps/desktop/e2e/support/release-visual-pull-requests.test.ts apps/desktop/e2e/support/release-visual-pull-requests-caller.test.ts
      - name: Verify compiled PR public widgets
        if: ${{ inputs.scene_selection == 'release-visual-pull-requests' }}
        working-directory: apps/web
        run: vp test run --project unit src/release-visual-pull-requests.public.test.tsx src/release-visual-pull-requests-create.public.test.tsx
      - name: Verify browser follow-up composition and current public controls
        if: ${{ inputs.scene_selection == 'release-visual-browser-followups' }}
        run: |
          vp test run --no-file-parallelism apps/desktop/e2e/support/release-visual-browser-followups-caller.test.ts apps/desktop/e2e/support/release-visual-browser-followups-caller-resources.test.ts apps/desktop/e2e/support/release-visual-browser-followups-caller-protocol.test.ts apps/desktop/e2e/support/release-visual-terminal-replacement.test.mjs apps/desktop/e2e/support/release-visual-browser-followups-owner.test.ts apps/desktop/e2e/support/release-visual-browser-followups-producer.test.ts apps/desktop/e2e/support/release-visual-browser-followups-protocol.test.ts apps/desktop/e2e/support/release-visual-browser-followups-transport.test.ts apps/desktop/e2e/support/ci-import-private-evidence.test.ts apps/desktop/e2e/support/release-visual-import-evidence.test.ts apps/desktop/e2e/support/release-visual-import-evidence.integration.test.ts scripts/throttle-proxy.test.ts scripts/build-browser-followup-ui.test.mjs apps/desktop/e2e/support/release-visual-browser-followups-wiring.test.ts scripts/qualify-browser-followups-workflow.test.ts
      - name: Verify compiled browser follow-up public controls
        if: ${{ inputs.scene_selection == 'release-visual-browser-followups' }}
        working-directory: apps/web
        run: vp test run --project unit src/release-visual-browser-followups.public.test.tsx src/components/add-project/useAddProjectWorkflow.public.test.tsx
      - name: Build immutable primary and hosted follow-up UI separately
        if: ${{ inputs.scene_selection == 'release-visual-browser-followups' }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'issue29-browser-build').mkdir(mode=0o700)
          PYTHON
          node scripts/build-browser-followup-ui.mjs --build primary "$RUNNER_TEMP/issue29-browser-build" "$GITHUB_SHA"
          node scripts/build-browser-followup-ui.mjs --build hosted "$RUNNER_TEMP/issue29-browser-build" "$GITHUB_SHA"
      - name: Build the source UI once with owned loopback targets
        if: ${{ inputs.scene_selection != 'release-visual-browser-followups' }}
        env:
          VITE_WS_URL: ws://127.0.0.1:4885
          VITE_HTTP_URL: http://127.0.0.1:4885
          VITE_DEV_SERVER_URL: http://127.0.0.1:4885
        run: vp run --filter @bibcode/web build
      - name: Required static gates
        run: |
          vp check
          vp exec tsc --noEmit -p apps/desktop/e2e/tsconfig.json
          vp exec tsc --noEmit -p scripts/tsconfig.json
      - name: Verify inert Cursor runtime question protocol
        if: ${{ inputs.scene_selection == 'release-visual-cursor-question' }}
        run: cargo test -p bibcode-server --lib provider::cursor::runtime::tests::owned_later_question_keeps_multiple_labels_and_original_prompt_correlation -j 2 -- --exact
      - name: Verify native server descriptor parity
        if: ${{ inputs.scene_selection == 'release-visual-project-lifecycle' || inputs.scene_selection == 'release-visual-settings-followups' || inputs.scene_selection == 'release-visual-pull-requests' }}
        run: |
          cargo fmt --all --check
          cargo test -p bibcode-server --test server_runtime -j 2
          cargo clippy -p bibcode-server --all-targets -j 2 -- -D warnings
      - name: Verify cookie origin and pairing profile contracts
        if: ${{ inputs.scene_selection == 'release-visual-browser-followups' }}
        run: |
          cargo test -p bibcode-server --lib auth::http::tests::cookie_origin_matches_host_or_the_dev_origin -j 2 -- --exact
          cargo test -p bibcode-server --lib config::tests::pairing_commands_preserve_dev_url_and_select_the_matching_state -j 2 -- --exact
      - name: Build guarded production CLI
        run: cargo build -p bibcode-server --bin bibcode --features hermetic-test-guard -j 2
      - name: Copy immutable inputs outside Cargo output
        env:
          BIBCODE_SCENE_SELECTION: ${{ inputs.scene_selection }}
        run: |
          python3 - <<'PYTHON'
          import os, shutil
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'issue29-visual-build'
          target.mkdir(mode=0o700)
          shutil.copy2('target/debug/bibcode', target / 'bibcode')
          if os.environ['BIBCODE_SCENE_SELECTION'] == 'release-visual-browser-followups':
              build = Path(os.environ['RUNNER_TEMP']) / 'issue29-browser-build'
              shutil.copytree(build / 'primary-assets', target / 'web')
              shutil.copytree(build / 'hosted-assets', target / 'hosted-web')
          else:
              shutil.copytree('apps/web/dist', target / 'web')
          (target / 'bibcode').chmod(0o500)
          PYTHON
      - name: Run contained browser follow-up original batch
        if: ${{ inputs.scene_selection == 'release-visual-browser-followups' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
          BIBCODE_IMPORT_EVIDENCE_SELECTED: "${{ github.event_name == 'workflow_dispatch' && inputs.import_evidence_public_spki != '' && inputs.import_evidence_public_sha256 != '' }}"
          BIBCODE_IMPORT_EVIDENCE_PUBLIC_SPKI: ${{ inputs.import_evidence_public_spki }}
          BIBCODE_IMPORT_EVIDENCE_PUBLIC_SHA256: ${{ inputs.import_evidence_public_sha256 }}
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-browser-followups
      - name: Retain optional encrypted import failure
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.scene_selection == 'release-visual-browser-followups' && inputs.import_evidence_public_spki != '' && inputs.import_evidence_public_sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue29-import-private-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/import-private/ready/context.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/import-private/ready/reply.aesgcm.bin
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/import-private/ready/key.rsa-oaep-sha256.bin
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/import-private/ready/nonce.bin
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/import-private/ready/tag.bin
      - name: Retain finite browser follow-up original evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-browser-followups' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue29-browser-followups-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/chat-staged-attachment-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/chat-staged-attachment-dark.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/terminal-shared-size-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/terminal-shared-size-dark.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/source-control-panel-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/source-control-panel-dark.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/slow-requests-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/slow-requests-dark.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/hosted-pair-confirm-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/hosted-pair-confirm-dark.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/hosted-pair-incomplete-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/hosted-pair-incomplete-dark.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/source-control-panel-overview-light.png
            ${{ runner.temp }}/issue29-browser-followups-${{ github.run_id }}/source-control-panel-overview-dark.png
      - name: Run contained first visual batch
        if: ${{ inputs.scene_selection == 'release-visual-core' || inputs.scene_selection == '' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-core
      - name: Run contained settings visual batch
        if: ${{ inputs.scene_selection == 'release-visual-settings' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-settings
      - name: Run contained Git/project visual batch
        if: ${{ inputs.scene_selection == 'release-visual-git-project' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-git-project
      - name: Retain explicit safe evidence
        if: ${{ always() && (inputs.scene_selection == 'release-visual-core' || inputs.scene_selection == '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-core-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-composite-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-composite-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-card-menu-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-card-menu-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/worktree-create-ref-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/worktree-create-ref-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-image-diff-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-image-diff-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-changes-diff-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-changes-diff-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-history-stashes-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-history-stashes-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-branch-menu-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-branch-menu-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/files-editor-comment-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/files-editor-comment-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/command-palette-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/command-palette-dark.png
      - name: Retain explicit settings evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-settings' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-settings-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-provider-form-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-provider-form-dark.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/model-picker-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/model-picker-dark.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-keybindings-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-keybindings-dark.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-source-control-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-source-control-dark.png
      - name: Retain explicit Git/project evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-git-project' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-git-project-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/worktree-discovery-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/worktree-discovery-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-open-directory-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-open-directory-dark.png
