            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/git-history-stashes-selected-diff-dark.png
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/files-editor-comment-item-context-menu-light.png
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/files-editor-comment-item-context-menu-dark.png
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/workspace-composite-activity-lines-light.png
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/workspace-composite-activity-lines-dark.png
