name: First release visual batch (manual preparation lane)

on:
  workflow_dispatch:
    inputs:
      scene_selection:
        description: Fixed visual preparation selection
        type: choice
        required: true
        default: release-visual-core
        options:
          - release-visual-core
          - release-visual-settings
          - release-visual-git-project
          - release-visual-cursor-question
          - release-visual-workspace-substates

permissions:
  contents: read

jobs:
  visual_core:
    name: ${{ inputs.scene_selection == 'release-visual-workspace-substates' && 'Linux Chromium three existing workspace substates in both themes' || inputs.scene_selection == 'release-visual-cursor-question' && 'Linux Chromium Cursor later-question pair' || inputs.scene_selection == 'release-visual-git-project' && 'Linux Chromium Git/project partial group in both themes' || inputs.scene_selection == 'release-visual-settings' && 'Linux Chromium four settings pairs in both themes' || 'Linux Chromium eight scene pairs in both themes' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Check owned helpers and namespace admission
        run: |
          python3 -B scripts/qualify-chat-uploads.test.py
          python3 -B scripts/qualify-chat-network.test.py
          python3 -B scripts/qualify-chat-uploads.py preflight
          vp test run scripts/qualify-release-visuals-workflow.test.ts apps/desktop/e2e/support/release-visual-fixture.test.ts apps/desktop/e2e/support/release-visual-core.test.ts apps/desktop/e2e/support/git-project-tab-interception.test.ts apps/desktop/e2e/support/release-visual-git-dialog-settled.test.tsx apps/desktop/e2e/support/owned-visual-capture.test.ts apps/desktop/e2e/support/release-visual-cursor-question-fixture.test.ts apps/desktop/e2e/support/release-visual-cursor-question.test.ts apps/desktop/e2e/support/release-visual-cursor-question.public.test.ts apps/desktop/e2e/support/test-project.test.ts apps/desktop/e2e/support/release-visual-palette-readiness.test.tsx apps/desktop/e2e/support/release-visual-core-image.test.ts apps/desktop/e2e/support/release-visual-evidence.test.ts apps/desktop/e2e/support/release-visual-observation.test.ts apps/desktop/e2e/support/release-visual-boundaries.test.ts apps/desktop/e2e/support/provider-shims.test.ts apps/desktop/e2e/support/qualification-owner.test.ts apps/desktop/e2e/support/remote-ui-evidence.test.ts apps/desktop/e2e/support/delivery-retry-evidence.test.ts apps/desktop/e2e/support/delivery-retry-flow.test.ts apps/desktop/e2e/support/delivery-retry-controller.test.ts apps/desktop/e2e/support/delivery-import-observation.test.ts apps/desktop/e2e/support/delivery-retry-workspace.test.ts apps/desktop/e2e/support/browser-network.test.ts
          vp test run apps/desktop/e2e/support/release-visual-settings.test.ts apps/desktop/e2e/support/release-visual-settings-fixture.test.ts apps/desktop/e2e/support/release-visual-settings-preflight.test.ts apps/desktop/e2e/support/release-visual-settings-wiring.test.ts
          vp test run apps/desktop/e2e/support/release-visual-git-project.test.ts apps/desktop/e2e/support/release-visual-git-project-fixture.test.ts
          vp test run apps/desktop/e2e/support/release-visual-workspace-substates.test.ts
      - name: Build the source UI once with owned loopback targets
        env:
          VITE_WS_URL: ws://127.0.0.1:4885
          VITE_HTTP_URL: http://127.0.0.1:4885
          VITE_DEV_SERVER_URL: http://127.0.0.1:4885
        run: vp run --filter @bibcode/web build
      - name: Required static gates
        run: |
          vp check
          vp exec tsc --noEmit -p apps/desktop/e2e/tsconfig.json
          vp exec tsc --noEmit -p scripts/tsconfig.json
      - name: Verify inert Cursor runtime question protocol
        if: ${{ inputs.scene_selection == 'release-visual-cursor-question' }}
        run: cargo test -p bibcode-server --lib provider::cursor::runtime::tests::owned_later_question_keeps_multiple_labels_and_original_prompt_correlation -j 2 -- --exact
      - name: Build guarded production CLI
        run: cargo build -p bibcode-server --bin bibcode --features hermetic-test-guard -j 2
      - name: Copy immutable inputs outside Cargo output
        run: |
          python3 - <<'PYTHON'
          import os, shutil
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'issue29-visual-build'
          target.mkdir(mode=0o700)
          shutil.copy2('target/debug/bibcode', target / 'bibcode')
          shutil.copytree('apps/web/dist', target / 'web')
          (target / 'bibcode').chmod(0o500)
          PYTHON
      - name: Run contained first visual batch
        if: ${{ inputs.scene_selection == 'release-visual-core' || inputs.scene_selection == '' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-core
      - name: Run contained settings visual batch
        if: ${{ inputs.scene_selection == 'release-visual-settings' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-settings
      - name: Run contained Git/project visual batch
        if: ${{ inputs.scene_selection == 'release-visual-git-project' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-git-project
      - name: Retain explicit safe evidence
        if: ${{ always() && (inputs.scene_selection == 'release-visual-core' || inputs.scene_selection == '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-core-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-composite-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-composite-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-card-menu-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/workspace-card-menu-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/worktree-create-ref-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/worktree-create-ref-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-image-diff-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-image-diff-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-changes-diff-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-changes-diff-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-history-stashes-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-history-stashes-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-branch-menu-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/git-branch-menu-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/files-editor-comment-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/files-editor-comment-dark.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/command-palette-light.png
            ${{ runner.temp }}/issue29-core-${{ github.run_id }}/command-palette-dark.png
      - name: Retain explicit settings evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-settings' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-settings-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-provider-form-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-provider-form-dark.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/model-picker-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/model-picker-dark.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-keybindings-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-keybindings-dark.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-source-control-light.png
            ${{ runner.temp }}/issue29-settings-${{ github.run_id }}/settings-source-control-dark.png
      - name: Retain explicit Git/project evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-git-project' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-git-project-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/worktree-discovery-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/worktree-discovery-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-open-directory-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-open-directory-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-clone-chooser-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-clone-chooser-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-clone-incomplete-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/project-clone-incomplete-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-tags-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-tags-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-switch-with-changes-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-switch-with-changes-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-merge-conflict-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-merge-conflict-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-rewrite-preview-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-rewrite-preview-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-unborn-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-unborn-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-no-repository-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-no-repository-dark.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-broken-recovery-light.png
            ${{ runner.temp }}/issue29-git-project-${{ github.run_id }}/git-broken-recovery-dark.png
      - name: Run contained Cursor later-question pair
        if: ${{ inputs.scene_selection == 'release-visual-cursor-question' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-cursor-question
      - name: Retain explicit Cursor question evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-cursor-question' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-cursor-question-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/supervisor.json
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/question-multiselect-light.png
            ${{ runner.temp }}/issue29-cursor-question-${{ github.run_id }}/question-multiselect-dark.png
      - name: Run contained workspace substate batch
        if: ${{ inputs.scene_selection == 'release-visual-workspace-substates' }}
        env:
          BIBCODE_UPLOAD_SERVER: ${{ runner.temp }}/issue29-visual-build/bibcode
          BIBCODE_DELIVERY_UI_WEB: ${{ runner.temp }}/issue29-visual-build/web
        run: python3 -B scripts/qualify-chat-uploads.py --scenario release-visual-workspace-substates
      - name: Retain explicit workspace substate evidence
        if: ${{ always() && inputs.scene_selection == 'release-visual-workspace-substates' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-workspace-substates-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/phase.json
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/provenance.json
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/result.json
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/assertions.json
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/namespace-cleanup.json
            ${{ runner.temp }}/issue29-workspace-substates-${{ github.run_id }}/supervisor.json
