# Temporary qualification branch profile of the existing registered workflow.
# This replaces desktop-upgrade-smoke.yml only on that branch; it runs no installer.
name: Issue 26 native watchdog qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_watchdog:
    name: Watchdog and paired overhead - ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact approved baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7e8722dbd72d1180992a63512b3bd7b34437d343
          path: base
          persist-credentials: false
      - name: Checkout immutable qualification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: changed
          persist-credentials: false
      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache separately owned Rust targets
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            base -> target
            changed -> target
          shared-key: issue26-native-watchdog
      - name: Record native host and separately build both artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir evidence
          uname -a > evidence/host.txt
          rustc -Vv > evidence/rustc.txt
          cargo -V > evidence/cargo.txt
          git -C base rev-parse HEAD > evidence/base-sha.txt
          git -C changed rev-parse HEAD > evidence/changed-sha.txt
          (cd base && cargo test -p bibcode-server --test turn_delivery_recovery --no-run --message-format=json -j 2) > evidence/base-build.jsonl 2> evidence/base-build.log
          (cd changed && cargo test -p bibcode-server --test turn_delivery_recovery --no-run --message-format=json -j 2) > evidence/changed-build.jsonl 2> evidence/changed-build.log
      - name: Run reviewed hermetic comparisons and native acceptance
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 changed/scripts/issue26-native-watchdog-evidence.py base changed evidence
      - name: Retain exact source and native observation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue26-watchdog-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
