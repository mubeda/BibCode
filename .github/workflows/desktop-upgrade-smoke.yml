name: Seeded Packaged Desktop Upgrade

on:
  pull_request:
  workflow_dispatch:
    inputs:
      native_followups:
        description: Only the existing native visual follow-up partitions
        type: boolean
        default: false
      native_windows_only:
        description: Run only the Windows WSL native follow-up partition
        type: boolean
        default: false
      wsl_prepare_refusal_evidence:
        description: Optional encrypted original Windows owned Prepare refusal
        type: boolean
        default: false
      gpg_evidence_public_spki:
        description: Optional public RSA SPKI for one encrypted Windows GPG refusal
        type: string
        default: ""
      gpg_evidence_public_sha256:
        description: Lowercase SHA256 of the paired decoded public SPKI DER
        type: string
        default: ""
  workflow_call:
    inputs:
      native_followups:
        type: boolean
        default: false
      native_windows_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seeded_upgrade_smoke:
    if: ${{ inputs.native_followups != true }}
    name: Seeded upgrade - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobTimeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              label: Linux arm64 AppImage,
              runner: ubuntu-22.04-arm,
              platform: linux,
              arch: arm64,
              bundle: appimage,
              jobTimeoutMinutes: 240,
            }
          - {
              label: Linux x64 AppImage,
              runner: ubuntu-22.04,
              platform: linux,
              arch: x64,
              bundle: appimage,
              jobTimeoutMinutes: 240,
            }
          - {
              label: Windows arm64 NSIS,
              runner: windows-11-vs2026-arm,
              platform: win,
              arch: arm64,
              bundle: nsis,
              jobTimeoutMinutes: 240,
            }
          - {
              label: Windows x64 NSIS,
              runner: windows-2025,
              platform: win,
              arch: x64,
              bundle: nsis,
              jobTimeoutMinutes: 240,
            }
          - {
              label: macOS arm64,
              runner: macos-26,
              platform: mac,
              arch: arm64,
              bundle: dmg,
              jobTimeoutMinutes: 240,
            }
          # Three cold 90-minute builds + three 10-minute installs + setup and all upgrade lanes.
          - {
              label: macOS x64,
              runner: macos-26-intel,
              platform: mac,
              arch: x64,
              bundle: dmg,
              jobTimeoutMinutes: 360,
            }
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: Install Linux packaged-updater prerequisites
        if: matrix.platform == 'linux'
        run: |
          s''udo apt-get update
          s''udo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev xdg-utils patchelf xvfb xdotool

      - name: Install frozen dependencies
        run: vp install --frozen-lockfile

      - id: versions
        name: Resolve previous stable and isolated candidate versions
        shell: bash
        run: |
          set -euo pipefail
          previous_line="$(node scripts/resolve-previous-release-tag.ts \
            --channel stable --current-tag "v2147483647.0.0")"
          previous_tag="${previous_line#previous_tag=}"
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          previous_core="${previous_version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$previous_core"
          candidate_version="$major.$minor.$((patch + 1))-upgrade.${GITHUB_RUN_NUMBER}"
          {
            echo "candidate_version=$candidate_version"
            echo "previous_tag=$previous_tag"
            echo "previous_version=$previous_version"
          } >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral updater signing key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/bibcode-seeded-upgrade.key"
          key_password="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$key_password"
          (cd apps/desktop && vp exec tauri signer generate \
            --ci --password "$key_password" --write-keys "$key_path" >/dev/null)
          test -s "$key_path"
          test -s "$key_path.pub"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$key_path"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$key_password"
            echo "BIBCODE_UPGRADE_PUBLIC_KEY_FILE=$key_path.pub"
          } >> "$GITHUB_ENV"

      - name: Run previous-stable, protected-baseline, and remote-install upgrades
        shell: bash
        run: |
          set -euo pipefail
          args=(node scripts/seeded-desktop-upgrade-smoke.ts
            --platform "${{ matrix.platform }}"
            --arch "${{ matrix.arch }}"
            --bundle "${{ matrix.bundle }}"
            --candidate-version "${{ steps.versions.outputs.candidate_version }}"
            --previous-tag "${{ steps.versions.outputs.previous_tag }}"
            --previous-version "${{ steps.versions.outputs.previous_version }}"
            --public-key-file "$BIBCODE_UPGRADE_PUBLIC_KEY_FILE"
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.platform }}-${{ matrix.arch }}"
            --work-root "$RUNNER_TEMP/bibcode-seeded-upgrade/work"
            --artifact-dir "$RUNNER_TEMP/bibcode-seeded-upgrade/evidence"
            --updater-port 43120
            --restart-timeout-ms 180000)
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run --auto-servernum "${args[@]}"
          else
            "${args[@]}"
          fi

      - name: Upload bounded seeded-upgrade evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-upgrade-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/bibcode-seeded-upgrade/evidence/*
          if-no-files-found: error
          retention-days: 7

  windows_wsl_upgrade_smoke:
    name: Seeded upgrade - Windows WSL primary
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: wsl
        name: Detect declared WSL capability
        shell: pwsh
        run: |
          $output = wsl --status 2>&1 | Out-String
          $statusAvailable = $LASTEXITCODE -eq 0
          $nativeSelected = '${{ inputs.native_followups }}' -eq 'true'
          $listObserved = $false
          $listSucceeded = $null
          if ($nativeSelected) {
            "status_succeeded=$($statusAvailable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          $distros = @()
          if ($statusAvailable) {
            $distros = @(wsl --list --quiet 2>$null | ForEach-Object { ($_ -replace "`0", "").Trim() } | Where-Object { $_ })
            $listObserved = $true
            $listSucceeded = $LASTEXITCODE -eq 0
          }
          if ($nativeSelected) {
            "list_observed=$($listObserved.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "list_succeeded=$(($listSucceeded -eq $true).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          if ($statusAvailable -and $distros.Count -gt 0 -and (-not $nativeSelected -or $listSucceeded)) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "capability_reason=WSL and an installed distribution are available" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            if ($nativeSelected) {
              $reasonCode = if (-not $statusAvailable) { 'wsl-status-failed' } elseif (-not $listSucceeded) { 'wsl-list-failed' } else { 'wsl-no-distro' }
              "reason_code=$reasonCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
            $reason = if (-not $statusAvailable) { "wsl --status is unavailable" } else { "WSL has no installed distribution" }
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "capability_reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - id: gpg_private_root
        name: Reserve optional encrypted GPG evidence output
        if: github.event_name == 'workflow_dispatch' && inputs.native_followups == true && inputs.native_windows_only == true && inputs.gpg_evidence_public_spki != '' && inputs.gpg_evidence_public_sha256 != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $ready = $false
          $reservation = $null
          try {
            $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $parent = Get-Item -LiteralPath $temp -Force -ErrorAction Stop
            if (-not $parent.PSIsContainer -or $parent.FullName -ine $temp) { throw 'Optional evidence omitted.' }
            for ($cursor = $parent; $null -ne $cursor; $cursor = $cursor.Parent) {
              if (($cursor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Optional evidence omitted.' }
            }
            $root = Join-Path $temp 'bibcode-gpg-private-evidence'
            $reservation = [IO.File]::Open((Join-Path $temp 'bibcode-gpg-private-evidence.reserve'),[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
            if (Test-Path -LiteralPath $root) { throw 'Optional evidence omitted.' }
            New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
            $me = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $system = [Security.Principal.SecurityIdentifier]::new('S-1-5-18')
            $acl = Get-Acl -LiteralPath $root -ErrorAction Stop
            $acl.SetOwner($me)
            $acl.SetAccessRuleProtection($true,$false)
            foreach ($rule in @($acl.Access)) { $acl.RemoveAccessRuleAll($rule) | Out-Null }
            foreach ($sid in @($me,$system)) { $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow')) }
            Set-Acl -LiteralPath $root -AclObject $acl -ErrorAction Stop
            $checked = Get-Acl -LiteralPath $root -ErrorAction Stop
            if (-not $checked.AreAccessRulesProtected -or $checked.GetOwner([Security.Principal.SecurityIdentifier]).Value -cne $me.Value -or @($checked.Access).Count -ne 2) { throw 'Optional evidence omitted.' }
            $ready = $true
          } catch { $ready = $false } finally { if ($null -ne $reservation) { $reservation.Dispose() } }
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - id: native_wsl
        name: Prepare one authenticated owned WSL2 native fixture
        if: inputs.native_followups == true
        shell: pwsh
        env:
          BIBCODE_NATIVE_WSL_FIXTURE_SELECTED: "true"
          BIBCODE_PREPARE_REFUSAL_SELECTED: "${{ github.event_name == 'workflow_dispatch' && inputs.native_followups == true && inputs.native_windows_only == true && inputs.wsl_prepare_refusal_evidence == true }}"
          BIBCODE_GPG_EVIDENCE_SELECTED: "${{ github.event_name == 'workflow_dispatch' && inputs.native_followups == true && inputs.native_windows_only == true }}"
          BIBCODE_GPG_EVIDENCE_ROOT_READY: "${{ steps.gpg_private_root.outputs.ready }}"
          BIBCODE_GPG_EVIDENCE_PUBLIC_SPKI: "${{ (github.event_name == 'workflow_dispatch' && inputs.native_followups == true && inputs.native_windows_only == true) && inputs.gpg_evidence_public_spki || '' }}"
          BIBCODE_GPG_EVIDENCE_PUBLIC_SHA256: "${{ (github.event_name == 'workflow_dispatch' && inputs.native_followups == true && inputs.native_windows_only == true) && inputs.gpg_evidence_public_sha256 || '' }}"
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          $tests = Invoke-Pester -Path ./scripts/owned-wsl2-fixture.Tests.ps1 -PassThru
          if ($tests.FailedCount -ne 0) { throw 'Owned WSL fixture Pester controls failed' }
          $prepareEvidenceState=@{active=$false;attempted=$false;public=$null;fingerprint=$null;context=$null;root=$null}
          $prepareRefusalObserver=$null
          try {
            if($env:BIBCODE_PREPARE_REFUSAL_SELECTED -ceq 'true' -and $env:BIBCODE_GPG_EVIDENCE_ROOT_READY -ceq 'true' -and $env:CI -ceq 'true' -and $env:GITHUB_ACTIONS -ceq 'true' -and $env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and $env:GITHUB_JOB -ceq 'windows_wsl_upgrade_smoke' -and [OperatingSystem]::IsWindows()) {
              $run=0L;$attempt=0L
              if($env:GITHUB_SHA -cnotmatch '\A[a-f0-9]{40}\z' -or -not [long]::TryParse($env:GITHUB_RUN_ID,[ref]$run) -or $run -lt 1 -or $run -gt 9007199254740991 -or -not [long]::TryParse($env:GITHUB_RUN_ATTEMPT,[ref]$attempt) -or $attempt -lt 1 -or $attempt -gt 9007199254740991){throw 'Optional evidence omitted.'}
              if(-not ('OwnedGpgEvidenceV1' -as [type]) -or -not [OwnedGpgEvidenceV1]::RecipientAdmitted($env:BIBCODE_GPG_EVIDENCE_PUBLIC_SPKI,$env:BIBCODE_GPG_EVIDENCE_PUBLIC_SHA256)){throw 'Optional evidence omitted.'}
              . ./scripts/owned-wsl2-fixture.ps1
              Initialize-PhysicalReader
              $prepareEvidenceState.public=$env:BIBCODE_GPG_EVIDENCE_PUBLIC_SPKI
              $prepareEvidenceState.fingerprint=$env:BIBCODE_GPG_EVIDENCE_PUBLIC_SHA256
              $context=[ordered]@{version=1;scope='wsl-owned-prepare-refusal';alg='RSA-OAEP-SHA256';enc='AES-256-GCM';source=$env:GITHUB_SHA;run=$run;attempt=$attempt;jobRole='windows-native';fingerprint=$prepareEvidenceState.fingerprint}
              $prepareEvidenceState.context=[Text.UTF8Encoding]::new($false,$true).GetBytes(($context|ConvertTo-Json -Compress))
              $prepareEvidenceState.root=Join-Path $env:RUNNER_TEMP 'bibcode-gpg-private-evidence'
              $prepareRefusalObserver={
                param($originalErrorRecord)
                $payload=$null;$parts=$null
                try {
                  if($prepareEvidenceState.active -ne $true -or $prepareEvidenceState.attempted -eq $true){return}
                  $prepareEvidenceState.attempted=$true
                  $payload=[OwnedWslPrepareProjection]::Serialize($originalErrorRecord)
                  if($null -eq $payload){return}
                  $parts=[OwnedGpgEvidenceV1]::Seal($prepareEvidenceState.public,$prepareEvidenceState.fingerprint,$payload,$prepareEvidenceState.context)
                  [OwnedGpgEvidenceV1]::Publish($prepareEvidenceState.root,$parts)
                } catch { } finally { $payload=$null;$parts=$null }
              }.GetNewClosure()
            }
          } catch { $prepareRefusalObserver=$null }
          $manifest = Join-Path $env:RUNNER_TEMP 'bibcode-owned-wsl2-owner/owner.secret.json'
          $available = $false
          $prepareStage = $null
          $signedMetadata = $null
          $reason = '${{ steps.wsl.outputs.reason_code }}'
          if ('${{ steps.wsl.outputs.status_succeeded }}' -eq 'true' -and '${{ steps.wsl.outputs.list_succeeded }}' -eq 'true') {
            try {
              $prepareEvidenceState.active=$null -ne $prepareRefusalObserver
              $result = & ./scripts/owned-wsl2-fixture.ps1 -Action Prepare -OwnerManifest $manifest -SourceSha $env:GITHUB_SHA -PrepareRefusalObserver $prepareRefusalObserver
          function Assert-SignedMetadata($value) {
            $keys=@('item','operation','httpStatus','commandExit','sizeMatched','fingerprintCount','fingerprintMatched','signatureCount','signerMatched','checksumCount','checksumMatched')
            if($null -eq $value -or @($value.PSObject.Properties.Name).Count -ne $keys.Count) { throw 'Signed metadata shape refused' }
            foreach($key in $keys){if($key -cnotin @($value.PSObject.Properties.Name)){throw 'Signed metadata key refused'}}
            if($null -ne $value.item -and ((-not ($value.item -is [string])) -or $value.item -cnotin @('key','checksums','signature'))){throw 'Signed metadata item refused'}
            if($null -ne $value.operation -and ((-not ($value.operation -is [string])) -or $value.operation -cnotin @('get','file-acl','size-admission','gpg-import','fingerprint-admission','signature-admission','checksum-admission'))){throw 'Signed metadata operation refused'}
            foreach($key in @('sizeMatched','fingerprintMatched','signerMatched','checksumMatched')){if($null -ne $value.$key -and (-not ($value.$key -is [bool]))){throw 'Signed metadata bool refused'}}
            foreach($key in @('httpStatus','commandExit','fingerprintCount','signatureCount','checksumCount')){
              $number=$value.$key;if($null -eq $number){continue}
              if((-not ($number -is [int])) -and (-not ($number -is [long]))){throw 'Signed metadata integer refused'}
              $low=0;$high=2;if($key -ceq 'httpStatus'){$low=100;$high=599}elseif($key -ceq 'commandExit'){$high=255}
              if($number -lt $low -or $number -gt $high){throw 'Signed metadata bound refused'}
            }
          }
            $receipt = $result | ConvertFrom-Json
            $available = $LASTEXITCODE -eq 0 -and $receipt.completed -eq $true
            if (-not $available) {
              $reason = 'wsl-fixture-owner-refused'
              $fields = @($receipt.PSObject.Properties.Name)
              $prepareStage = $receipt.prepareStage
              $expectedFields=if($prepareStage -ceq 'signed-metadata'){3}else{2}
              if ($fields.Count -ne $expectedFields -or 'completed' -notin $fields -or 'prepareStage' -notin $fields -or (-not ($receipt.completed -is [bool])) -or $receipt.completed -ne $false -or (-not ($prepareStage -is [string])) -or $prepareStage -cnotin @('runtime-admission','private-root-acl','launcher-admission','empty-inventory','launcher-readiness','verifier-admission','signed-metadata','image-admission','intent-write','owned-import','kernel-admission','mapping-admission')) { throw 'Owned WSL Prepare metadata refused' }
            }
            } finally {
              $prepareEvidenceState.active=$false
              $prepareRefusalObserver=$null
              $prepareEvidenceState.public=$null;$prepareEvidenceState.fingerprint=$null;$prepareEvidenceState.context=$null;$prepareEvidenceState.root=$null
              $context=$null
            }
          }
          "available=$($available.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "reason_code=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($reason -eq 'wsl-fixture-owner-refused') {
            if($prepareStage -ceq 'signed-metadata'){if('signedMetadata' -cnotin $fields){throw 'Signed metadata receipt refused'};Assert-SignedMetadata $receipt.signedMetadata;$signedMetadata=$receipt.signedMetadata}
            "prepare_stage=$prepareStage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            if($null -ne $signedMetadata){"signed_metadata=$($signedMetadata|ConvertTo-Json -Compress)"|Out-File -FilePath $env:GITHUB_OUTPUT -Append}
          }
          "BIBCODE_NATIVE_WSL_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BIBCODE_NATIVE_WSL_FIXTURE_SELECTED=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Record native WSL prerequisite unavailable
        if: always() && inputs.native_followups == true && steps.native_wsl.outputs.available != 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bibcode-native-followups-wsl/evidence'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $system = New-Object Security.Principal.SecurityIdentifier 'S-1-5-18'
          $acl = Get-Acl -LiteralPath $root
          $acl.SetOwner($me); $acl.SetAccessRuleProtection($true,$false)
          foreach ($rule in @($acl.Access)) { $acl.RemoveAccessRuleAll($rule) }
          foreach ($sid in @($me,$system)) { $acl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))) }
          Set-Acl -LiteralPath $root -AclObject $acl
          $reasonCode = '${{ steps.native_wsl.outputs.reason_code }}'
          if ($reasonCode -notin @('wsl-status-failed','wsl-list-failed','wsl-no-distro','wsl-fixture-owner-refused')) { throw 'Native WSL closed reason unavailable' }
          $statusToken = '${{ steps.wsl.outputs.status_succeeded }}'
          $observedToken = '${{ steps.wsl.outputs.list_observed }}'
          $listToken = '${{ steps.wsl.outputs.list_succeeded }}'
          if ($statusToken -notin @('true','false') -or $observedToken -notin @('true','false') -or $listToken -notin @('true','false')) { throw 'Native WSL closed flags unavailable' }
          $statusSucceeded = $statusToken -eq 'true'
          $listObserved = $observedToken -eq 'true'
          $listSucceeded = if ($listObserved) { $listToken -eq 'true' } else { $null }
          $reasonMatches = (
            ($reasonCode -eq 'wsl-status-failed' -and -not $statusSucceeded -and -not $listObserved -and $null -eq $listSucceeded) -or
            ($reasonCode -eq 'wsl-list-failed' -and $statusSucceeded -and $listObserved -and $listSucceeded -eq $false) -or
            (($reasonCode -eq 'wsl-no-distro' -or $reasonCode -eq 'wsl-fixture-owner-refused') -and $statusSucceeded -and $listObserved -and $listSucceeded -eq $true)
          )
          if (-not $reasonMatches) { throw 'Native WSL closed status mismatch' }
          function Assert-SignedMetadata($value) {
            $keys=@('item','operation','httpStatus','commandExit','sizeMatched','fingerprintCount','fingerprintMatched','signatureCount','signerMatched','checksumCount','checksumMatched')
            if($null -eq $value -or @($value.PSObject.Properties.Name).Count -ne $keys.Count) { throw 'Signed metadata shape refused' }
            foreach($key in $keys){if($key -cnotin @($value.PSObject.Properties.Name)){throw 'Signed metadata key refused'}}
            if($null -ne $value.item -and ((-not ($value.item -is [string])) -or $value.item -cnotin @('key','checksums','signature'))){throw 'Signed metadata item refused'}
            if($null -ne $value.operation -and ((-not ($value.operation -is [string])) -or $value.operation -cnotin @('get','file-acl','size-admission','gpg-import','fingerprint-admission','signature-admission','checksum-admission'))){throw 'Signed metadata operation refused'}
            foreach($key in @('sizeMatched','fingerprintMatched','signerMatched','checksumMatched')){if($null -ne $value.$key -and (-not ($value.$key -is [bool]))){throw 'Signed metadata bool refused'}}
            foreach($key in @('httpStatus','commandExit','fingerprintCount','signatureCount','checksumCount')){
              $number=$value.$key;if($null -eq $number){continue}
              if((-not ($number -is [int])) -and (-not ($number -is [long]))){throw 'Signed metadata integer refused'}
              $low=0;$high=2;if($key -ceq 'httpStatus'){$low=100;$high=599}elseif($key -ceq 'commandExit'){$high=255}
              if($number -lt $low -or $number -gt $high){throw 'Signed metadata bound refused'}
            }
          }
          $status = @{schemaVersion=1;selection='release-visual-native-followups';sourceSha=$env:GITHUB_SHA;partition='windows-wsl';status='unavailable';reasonCode=$reasonCode;wslStatusSucceeded=$statusSucceeded;wslListObserved=$listObserved;wslListSucceeded=$listSucceeded;originalCount=0;requiredPartitionOriginalCount=2;previewOriginalCount=0;completeGroup=$false;visualReview='pending'}
          if ($reasonCode -eq 'wsl-fixture-owner-refused') {
            $prepareStage = '${{ steps.native_wsl.outputs.prepare_stage }}'
            if ((-not ($prepareStage -is [string])) -or $prepareStage -cnotin @('runtime-admission','private-root-acl','launcher-admission','empty-inventory','launcher-readiness','verifier-admission','signed-metadata','image-admission','intent-write','owned-import','kernel-admission','mapping-admission')) { throw 'Native WSL Prepare stage refused' }
            $status.prepareStage = $prepareStage
            if($prepareStage -ceq 'signed-metadata'){$signedMetadata='${{ steps.native_wsl.outputs.signed_metadata }}'|ConvertFrom-Json;Assert-SignedMetadata $signedMetadata;$status.signedMetadata=$signedMetadata}
          }
          $status | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $root 'native-followups-workflow-status.json') -Encoding utf8
          throw 'Native WSL partition remains unavailable'

      - name: Record unavailable WSL capability
        if: inputs.native_followups != true && steps.wsl.outputs.available != 'true'
        shell: pwsh
        run: |
          "WSL packaged-upgrade smoke skipped: ${{ steps.wsl.outputs.capability_reason }}" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup Vite+
        if: (inputs.native_followups != true && steps.wsl.outputs.available == 'true') || (inputs.native_followups == true && steps.native_wsl.outputs.available == 'true')
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        if: (inputs.native_followups != true && steps.wsl.outputs.available == 'true') || (inputs.native_followups == true && steps.native_wsl.outputs.available == 'true')
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

      - id: wsl_dependencies
        name: Install frozen dependencies
        if: (inputs.native_followups != true && steps.wsl.outputs.available == 'true') || (inputs.native_followups == true && steps.native_wsl.outputs.available == 'true')
        run: vp install --frozen-lockfile

      - id: native_wsl_source_gates
        name: Native WSL exact current-source gates
        if: inputs.native_followups == true && steps.native_wsl.outputs.available == 'true'
        run: |
          vp check
          vp run typecheck
          vp test run scripts/qualify-native-followups-workflow.test.ts apps/desktop/e2e/support/release-visual-native-followups-backup.test.ts apps/desktop/e2e/support/release-visual-native-followups-capture.test.ts apps/desktop/e2e/support/release-visual-native-followups-cleanup.test.ts apps/desktop/e2e/support/release-visual-native-followups-controller.test.ts apps/desktop/e2e/support/release-visual-native-followups-endpoint.test.ts apps/desktop/e2e/support/release-visual-native-followups-evidence.test.ts apps/desktop/e2e/support/release-visual-native-followups-os.test.ts apps/desktop/e2e/support/release-visual-native-followups-preparation.test.ts apps/desktop/e2e/support/release-visual-native-followups-preview.test.ts apps/desktop/e2e/support/release-visual-native-followups-public.test.ts apps/desktop/e2e/support/release-visual-native-followups-session.test.ts apps/desktop/e2e/support/release-visual-native-followups-portable.test.ts apps/desktop/e2e/support/release-visual-native-followups-state.test.ts apps/desktop/e2e/support/release-visual-native-followups-update.test.ts apps/desktop/e2e/support/release-visual-native-followups-windows.test.ts apps/desktop/e2e/support/release-visual-native-followups.test.ts scripts/seeded-desktop-upgrade-smoke.test.ts scripts/owned-wsl2-fixture-caller.test.ts scripts/lib/owned-wsl2-fixture.test.ts
      - id: native_wsl_public_controls
        name: Native WSL compiled public controls
        if: inputs.native_followups == true && steps.native_wsl.outputs.available == 'true'
        working-directory: apps/web
        run: vp test run --project unit src/release-visual-native-followups.public.test.tsx src/reactCompiler.test.tsx

      - name: Build the WSL server used by the packaged desktop
        if: inputs.native_followups != true && steps.wsl.outputs.available == 'true'
        shell: pwsh
        run: |
          $workspaceWsl = (wsl wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if ([string]::IsNullOrWhiteSpace($workspaceWsl)) {
            throw "WSL could not resolve the checkout path"
          }
          wsl bash -lc "set -euo pipefail; s''udo apt-get update; s''udo apt-get install -y build-essential clang cmake curl pkg-config libssl-dev"
          if ($LASTEXITCODE -ne 0) { throw "WSL build prerequisites failed" }
          wsl bash -lc "set -euo pipefail; if ! command -v cargo >/dev/null; then curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0; fi"
          if ($LASTEXITCODE -ne 0) { throw "WSL Rust setup failed" }
          $build = "set -euo pipefail; cd '$workspaceWsl'; export PATH=`"`$HOME/.cargo/bin:`$PATH`"; CARGO_TARGET_DIR='$workspaceWsl/target/x86_64-unknown-linux-gnu' cargo build -p bibcode-server --bin bibcode --release"
          wsl bash -lc $build
          if ($LASTEXITCODE -ne 0) { throw "WSL server build failed" }
          $serverBinary = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-unknown-linux-gnu\release\bibcode"
          if (-not (Test-Path -LiteralPath $serverBinary -PathType Leaf)) {
            throw "WSL server build did not produce the expected binary"
          }
          "BIBCODE_WSL_SERVER_BINARY=$serverBinary" | Out-File -FilePath $env:GITHUB_ENV -Append

      - id: wsl_versions
        name: Resolve WSL previous and candidate versions
        if: (inputs.native_followups != true && steps.wsl.outputs.available == 'true') || (inputs.native_followups == true && steps.native_wsl.outputs.available == 'true')
        shell: bash
        run: |
          set -euo pipefail
          previous_line="$(node scripts/resolve-previous-release-tag.ts --channel stable --current-tag "v2147483647.0.0")"
          previous_tag="${previous_line#previous_tag=}"
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          previous_core="${previous_version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$previous_core"
          candidate_version="$major.$minor.$((patch + 1))-wsl.${GITHUB_RUN_NUMBER}"
          {
            echo "candidate_version=$candidate_version"
            echo "previous_tag=$previous_tag"
            echo "previous_version=$previous_version"
          } >> "$GITHUB_OUTPUT"

      - id: native_wsl_signing
        name: Generate WSL ephemeral updater signing key
        if: (inputs.native_followups != true && steps.wsl.outputs.available == 'true') || (inputs.native_followups == true && steps.native_wsl.outputs.available == 'true')
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/bibcode-seeded-wsl-upgrade.key"
          key_password="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$key_password"
          (cd apps/desktop && vp exec tauri signer generate --ci --password "$key_password" --write-keys "$key_path" >/dev/null)
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$key_path"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$key_password"
            echo "BIBCODE_UPGRADE_PUBLIC_KEY_FILE=$key_path.pub"
          } >> "$GITHUB_ENV"

      - name: Run protected WSL storage-identity upgrade
        if: steps.wsl.outputs.available == 'true' && inputs.native_followups != true
        shell: bash
        run: |
          node scripts/seeded-desktop-upgrade-smoke.ts \
            --wsl \
            --platform win \
            --arch x64 \
            --bundle nsis \
            --candidate-version "${{ steps.wsl_versions.outputs.candidate_version }}" \
            --previous-tag "${{ steps.wsl_versions.outputs.previous_tag }}" \
            --previous-version "${{ steps.wsl_versions.outputs.previous_version }}" \
            --public-key-file "$BIBCODE_UPGRADE_PUBLIC_KEY_FILE" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-windows-wsl" \
            --work-root "$RUNNER_TEMP/bibcode-seeded-wsl-upgrade/work" \
            --artifact-dir "$RUNNER_TEMP/bibcode-seeded-wsl-upgrade/evidence" \
            --updater-port 43220 \
            --restart-timeout-ms 240000

      - id: native_wsl_visuals
        name: Run existing native Local WSL originals
        if: inputs.native_followups == true && steps.native_wsl.outputs.available == 'true'
        shell: bash
        run: |
          node scripts/qualify-native-followups-workflow.ts \
            --native-followups --wsl --owned-wsl-manifest "$BIBCODE_NATIVE_WSL_MANIFEST" --platform win --arch x64 --bundle nsis \
            --candidate-version "${{ steps.wsl_versions.outputs.candidate_version }}" \
            --previous-tag "${{ steps.wsl_versions.outputs.previous_tag }}" \
            --previous-version "${{ steps.wsl_versions.outputs.previous_version }}" \
            --public-key-file "$BIBCODE_UPGRADE_PUBLIC_KEY_FILE" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-native-wsl" \
            --work-root "$RUNNER_TEMP/bibcode-native-followups-wsl/work" \
            --artifact-dir "$RUNNER_TEMP/bibcode-native-followups-wsl/evidence" \
            --updater-port 43220 --restart-timeout-ms 240000

      - name: Join only the owned native WSL2 fixture after native app cleanup
        if: always() && inputs.native_followups == true
        shell: pwsh
        env:
          BIBCODE_NATIVE_WSL_FIXTURE_SELECTED: "true"
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'bibcode-owned-wsl2-owner/owner.secret.json'
          if (Test-Path -LiteralPath $manifest) {
            $failed = $false
            & ./scripts/owned-wsl2-fixture.ps1 -Action VerifyOwner -OwnerManifest $manifest -SourceSha $env:GITHUB_SHA | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Native WSL app or fixture ownership has not joined' }
            foreach ($action in @('Terminate','Unregister','Restored')) {
              & ./scripts/owned-wsl2-fixture.ps1 -Action $action -OwnerManifest $manifest -SourceSha $env:GITHUB_SHA | Out-Null
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
            if ($failed) { throw 'Owned WSL fixture cleanup refused' }
            & ./scripts/owned-wsl2-fixture.ps1 -Action Delete -OwnerManifest $manifest -SourceSha $env:GITHUB_SHA | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Owned WSL fixture deletion refused' }
          }

      - id: gpg_private_upload
        name: Retain optional encrypted Windows refusal only
        if: always() && github.event_name == 'workflow_dispatch' && inputs.native_followups == true && inputs.native_windows_only == true && inputs.gpg_evidence_public_spki != '' && inputs.gpg_evidence_public_sha256 != '' && steps.gpg_private_root.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-gpg-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bibcode-gpg-private-evidence/ready/context.json
            ${{ runner.temp }}/bibcode-gpg-private-evidence/ready/stderr.aesgcm.bin
            ${{ runner.temp }}/bibcode-gpg-private-evidence/ready/key.rsa-oaep-sha256.bin
            ${{ runner.temp }}/bibcode-gpg-private-evidence/ready/nonce.bin
            ${{ runner.temp }}/bibcode-gpg-private-evidence/ready/tag.bin
          if-no-files-found: ignore
          retention-days: 1

      - id: native_wsl_failed_status
        name: Record failed native WSL prerequisite status
        if: always() && !cancelled() && runner.os == 'Windows' && inputs.native_followups == true && steps.native_wsl.outputs.available == 'true' && steps.wsl_dependencies.outcome == 'success' && steps.native_wsl_visuals.outcome == 'skipped' && (steps.native_wsl_source_gates.outcome == 'failure' || steps.native_wsl_public_controls.outcome == 'failure' || steps.wsl_versions.outcome == 'failure' || steps.native_wsl_signing.outcome == 'failure')
        shell: bash
        env:
          BIBCODE_NATIVE_STATUS_SELECTED: "${{ inputs.native_followups }}"
          BIBCODE_NATIVE_STATUS_PREPARE_AVAILABLE: "${{ steps.native_wsl.outputs.available }}"
          BIBCODE_NATIVE_STATUS_DEPENDENCIES: "${{ steps.wsl_dependencies.outcome }}"
          BIBCODE_NATIVE_STATUS_PREREQUISITE: "${{ (steps.native_wsl_source_gates.outcome == 'failure' || steps.native_wsl_public_controls.outcome == 'failure' || steps.wsl_versions.outcome == 'failure' || steps.native_wsl_signing.outcome == 'failure') && 'failure' || 'skipped' }}"
          BIBCODE_NATIVE_STATUS_WRAPPER: "${{ steps.native_wsl_visuals.outcome }}"
          BIBCODE_NATIVE_STATUS_CANCELLED: "false"
        run: node scripts/qualify-native-followups-workflow.ts --failed-windows-prerequisite-status

      - name: Retain finite native WSL originals and closed status
        if: always() && inputs.native_followups == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-native-followups-windows-wsl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bibcode-native-followups-wsl/evidence/native-followups-workflow-status.json
            ${{ runner.temp }}/bibcode-native-followups-wsl/evidence/native-followups-result.json
            ${{ runner.temp }}/bibcode-native-followups-wsl/evidence/native-followups-originals.json
            ${{ runner.temp }}/bibcode-native-followups-wsl/evidence/native-followups-assertions.json
            ${{ runner.temp }}/bibcode-native-followups-wsl/evidence/native-wsl-local-light.png
            ${{ runner.temp }}/bibcode-native-followups-wsl/evidence/native-wsl-local-dark.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded WSL seeded-upgrade evidence
        if: always() && steps.wsl.outputs.available == 'true' && inputs.native_followups != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-upgrade-windows-wsl
          path: ${{ runner.temp }}/bibcode-seeded-wsl-upgrade/evidence/*
          if-no-files-found: error
          retention-days: 7

  native_followups_linux:
    if: ${{ inputs.native_followups == true && inputs.native_windows_only != true }}
    name: Existing native menu and update originals - Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact current source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Install real private native desktop service dependencies
        run: |
          s''udo apt-get update
          s''udo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils patchelf xvfb xdotool imagemagick dbus xdg-desktop-portal xdg-desktop-portal-gtk gsettings-desktop-schemas dconf-gsettings-backend gnome-settings-daemon at-spi2-core python3-gi gir1.2-atspi-2.0 libatk-adaptor openbox
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile
      - name: Required exact current-source gates
        run: |
          vp check
          vp run typecheck
          vp test run scripts/native-driver-failure-caller.test.ts scripts/qualify-native-followups-workflow.test.ts apps/desktop/e2e/support/release-visual-native-followups-backup.test.ts apps/desktop/e2e/support/release-visual-native-followups-capture.test.ts apps/desktop/e2e/support/release-visual-native-followups-cleanup.test.ts apps/desktop/e2e/support/release-visual-native-followups-controller.test.ts apps/desktop/e2e/support/release-visual-native-followups-endpoint.test.ts apps/desktop/e2e/support/release-visual-native-followups-evidence.test.ts apps/desktop/e2e/support/release-visual-native-followups-os.test.ts apps/desktop/e2e/support/release-visual-native-followups-preparation.test.ts apps/desktop/e2e/support/release-visual-native-followups-preview.test.ts apps/desktop/e2e/support/release-visual-native-followups-public.test.ts apps/desktop/e2e/support/release-visual-native-followups-session.test.ts apps/desktop/e2e/support/release-visual-native-followups-portable.test.ts apps/desktop/e2e/support/release-visual-native-followups-state.test.ts apps/desktop/e2e/support/release-visual-native-followups-update.test.ts apps/desktop/e2e/support/release-visual-native-followups-windows.test.ts apps/desktop/e2e/support/release-visual-native-followups.test.ts scripts/seeded-desktop-upgrade-smoke.test.ts scripts/owned-wsl2-fixture-caller.test.ts scripts/lib/owned-wsl2-fixture.test.ts
      - name: Actual compiled native public controls
        working-directory: apps/web
        run: vp test run --project unit src/release-visual-native-followups.public.test.tsx src/reactCompiler.test.tsx
      - id: versions
        name: Resolve isolated protected and candidate versions
        shell: bash
        run: |
          set -euo pipefail
          previous_line="$(node scripts/resolve-previous-release-tag.ts --channel stable --current-tag v2147483647.0.0)"
          previous_tag="${previous_line#previous_tag=}"
          previous_version="${previous_tag#v}"
          previous_core="${previous_version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$previous_core"
          candidate_version="$major.$minor.$((patch + 1))-native.${GITHUB_RUN_NUMBER}"
          { echo "previous_tag=$previous_tag"; echo "previous_version=$previous_version"; echo "candidate_version=$candidate_version"; } >> "$GITHUB_OUTPUT"
      - name: Generate isolated ephemeral updater signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/bibcode-native-followups.key"
          key_password="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$key_password"
          (cd apps/desktop && vp exec tauri signer generate --ci --password "$key_password" --write-keys "$key_path" >/dev/null)
          test -s "$key_path"; test -s "$key_path.pub"
          { echo "TAURI_SIGNING_PRIVATE_KEY=$key_path"; echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$key_password"; echo "BIBCODE_UPGRADE_PUBLIC_KEY_FILE=$key_path.pub"; } >> "$GITHUB_ENV"
      - name: Run existing native menu protection and recovery originals as nonroot
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24 -dpi 96' \
            node scripts/qualify-native-followups-workflow.ts \
              --native-followups --platform linux --arch x64 --bundle appimage \
              --candidate-version "${{ steps.versions.outputs.candidate_version }}" \
              --previous-tag "${{ steps.versions.outputs.previous_tag }}" \
              --previous-version "${{ steps.versions.outputs.previous_version }}" \
              --public-key-file "$BIBCODE_UPGRADE_PUBLIC_KEY_FILE" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-native-linux" \
              --work-root "$RUNNER_TEMP/bibcode-native-followups-linux/work" \
              --artifact-dir "$RUNNER_TEMP/bibcode-native-followups-linux/evidence" \
              --updater-port 43120 --restart-timeout-ms 180000
      - name: Retain finite native Linux originals and closed status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue29-native-followups-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-followups-workflow-status.json
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-followups-result.json
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-followups-originals.json
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-followups-assertions.json
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-menu-theme-light.png
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-menu-theme-dark.png
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-update-protection-light.png
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-update-protection-dark.png
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-update-recovery-light.png
            ${{ runner.temp }}/bibcode-native-followups-linux/evidence/native-update-recovery-dark.png
          if-no-files-found: error
          retention-days: 7
