name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string
      publish:
        description: "Publish an already inspected stable draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: none

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    # GitHub-hosted runners have fewer vCPUs than the upstream Blacksmith
    # runners, so the check/typecheck/test suite needs more headroom.
    timeout-minutes: 30
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      is_update_candidate: ${{ steps.release_meta.outputs.is_update_candidate }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      publish_requested: ${{ steps.release_meta.outputs.publish_requested }}
      ref: ${{ steps.release_meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ]]; then
            nightly_date="$(date -u +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_update_candidate=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "publish_requested=false" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases require the version input." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=BiBCode v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_PUBLISH:-false}" == "true" ]]; then
              echo "publish_requested=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_requested=false" >> "$GITHUB_OUTPUT"
            fi
            if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
              echo "ref=$(git rev-list -n 1 "refs/tags/v$version")" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "is_update_candidate=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "is_update_candidate=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ needs.preflight.outputs.is_update_candidate == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.preflight.outputs.is_update_candidate == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: appimage
            arch: x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
          # - label: Windows arm64
          #   runner: windows-11-arm
          #   platform: win
          #   target: nsis
          #   arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package manifest versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/desktop/src-tauri

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify stable updater signing configuration
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "Stable releases require Tauri updater signing configuration." >&2
            exit 1
          fi

      - name: Build desktop artifact
        shell: bash
        run: |
          args=(node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir release \
            --verbose)
          if [[ "${{ needs.preflight.outputs.is_update_candidate }}" == "true" ]]; then
            args+=(--updater)
          fi
          "${args[@]}"

      - name: Verify macOS ad-hoc application signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmg_paths=(release/*.dmg)
          if (( ${#dmg_paths[@]} != 1 )); then
            printf 'Expected exactly one macOS DMG in release/, found %s.\n' "${#dmg_paths[@]}" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || hdiutil detach -force "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -noautoopen \
            -mountpoint "$mount_dir" "${dmg_paths[0]}" >/dev/null

          app_paths=("$mount_dir"/*.app)
          if (( ${#app_paths[@]} != 1 )); then
            printf 'Expected exactly one application in the DMG, found %s.\n' "${#app_paths[@]}" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "${app_paths[0]}"
          signature_details="$(codesign --display --verbose=4 "${app_paths[0]}" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -Fq 'Signature=adhoc' <<< "$signature_details"
          grep -Fq 'TeamIdentifier=not set' <<< "$signature_details"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.AppImage" \
            "release/*.exe"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ needs.preflight.outputs.is_update_candidate }}" == "true" ]]; then
            for pattern in \
              "release/*.app.tar.gz" \
              "release/*.sig" \
              "release/updater-*.json"; do
              for file in $pattern; do
                cp "$file" release-publish/
              done
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  server_web_assets:
    name: Frozen server web assets
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align release versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - id: identity
        name: Resolve frozen web identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'artifact_name=server-web-assets-%s\n' "${{ needs.preflight.outputs.ref }}" >> "$GITHUB_OUTPUT"
          printf 'source_date_epoch=%s\n' "$(git show -s --format=%ct '${{ needs.preflight.outputs.ref }}')" >> "$GITHUB_OUTPUT"

      - name: Build server-only web assets
        run: vp run --filter @bibcode/web build:server-assets

      - name: Apply production brand assets
        run: node scripts/apply-web-brand-assets.ts production apps/web/dist

      - name: Freeze source-bound server web assets
        run: |
          node scripts/freeze-server-web-assets.ts \
            --assets-dir apps/web/dist \
            --output-dir release/server-web-input \
            --source-sha "${{ needs.preflight.outputs.ref }}"

      - name: Upload frozen server web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release/server-web-input/*
          if-no-files-found: error
          retention-days: 1

  server_build:
    name: Native server candidates
    needs: [preflight, server_web_assets]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.server_web_assets.result == 'success' }}
    uses: ./.github/workflows/server-native-smoke.yml
    with:
      release-ref: ${{ needs.preflight.outputs.ref }}
      source-sha: ${{ needs.preflight.outputs.ref }}
      source-date-epoch: ${{ needs.server_web_assets.outputs.source_date_epoch }}
      version: ${{ needs.preflight.outputs.version }}
      channel: ${{ needs.preflight.outputs.release_channel }}
      web-assets-artifact: ${{ needs.server_web_assets.outputs.artifact_name }}
    secrets: inherit

  server_sign:
    name: Sign and inventory server artifacts
    needs: [preflight, server_build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.server_build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Align release versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download every source-bound server candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-candidate-${{ needs.preflight.outputs.ref }}-*
          merge-multiple: true
          path: release/server-candidates

      - name: Install pinned SBOM and signing tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install minisign --version 0.12.0 --locked
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cyclonedx" \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64
          printf '%s  %s\n' \
            454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1 \
            "$RUNNER_TEMP/cyclonedx" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/cyclonedx"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          cargo cyclonedx --version | grep -F '0.5.9'
          "$RUNNER_TEMP/cyclonedx" --version | grep -F '0.32.0'
          minisign -v | grep -F '0.12'

      - name: Finalize signed checksums, SBOMs, and manifest
        shell: bash
        env:
          BIBCODE_SERVER_SIGNING_PRIVATE_KEY: ${{ secrets.BIBCODE_SERVER_SIGNING_PRIVATE_KEY }}
          BIBCODE_SERVER_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BIBCODE_SERVER_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct '${{ needs.preflight.outputs.ref }}')"
          generated_at="$(date -u -d "@$source_date_epoch" +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/sign-server-artifacts.ts \
            --artifact-root release/server-candidates \
            --output-dir release/server-signed \
            --channel "${{ needs.preflight.outputs.release_channel }}" \
            --generated-at "$generated_at"

      - name: Verify the signed server release set
        run: |
          node scripts/verify-server-artifacts.ts \
            --manifest release/server-signed/artifacts.json \
            --directory release/server-signed \
            --public-key packaging/server/server-release.pub \
            --require-complete-matrix

      - name: Upload signed server release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-signed-${{ needs.preflight.outputs.ref }}
          path: release/server-signed/*
          if-no-files-found: error
          retention-days: 1

  server_smoke:
    name: Verify signed server release policy
    needs: [preflight, server_sign]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.server_sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download signed server release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-signed-${{ needs.preflight.outputs.ref }}
          path: release/server

      - name: Verify manifest, privacy, and retired-cloud policy
        run: |
          node scripts/verify-server-artifacts.ts \
            --manifest release/server/artifacts.json \
            --directory release/server \
            --public-key packaging/server/server-release.pub \
            --require-complete-matrix
          vp test --run scripts/privacy-contract.test.ts scripts/legacy-cloud-removal-contract.test.ts

  server_aggregate:
    name: Aggregate complete server release set
    needs: [preflight, server_smoke]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.server_smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download signed server release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-signed-${{ needs.preflight.outputs.ref }}
          path: release/server

      - name: Verify exact aggregate cardinality and signatures
        run: |
          node scripts/verify-server-artifacts.ts \
            --manifest release/server/artifacts.json \
            --directory release/server \
            --public-key packaging/server/server-release.pub \
            --require-complete-matrix

      - name: Upload complete server release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-release-set
          path: release/server/*
          if-no-files-found: error
          retention-days: 1

  server_attest:
    name: Attest server ${{ matrix.artifact-suffix }}
    needs: [preflight, server_aggregate]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.server_aggregate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        artifact-suffix:
          - x86_64-pc-windows-msvc.zip
          - windows-x86_64.msi
          - aarch64-pc-windows-msvc.zip
          - windows-aarch64.msi
          - x86_64-apple-darwin.tar.gz
          - aarch64-apple-darwin.tar.gz
          - macos-universal.pkg
          - x86_64-unknown-linux-gnu.tar.gz
          - linux-x86_64.deb
          - linux-x86_64.rpm
          - aarch64-unknown-linux-gnu.tar.gz
          - linux-aarch64.deb
          - linux-aarch64.rpm
    steps:
      - name: Download complete server release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release-set
          path: release/server

      - id: attest
        name: Attest artifact with its exact CycloneDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release/server/bibcode-server-${{ needs.preflight.outputs.version }}-${{ matrix.artifact-suffix }}
          sbom-path: release/server/bibcode-server-${{ needs.preflight.outputs.version }}-${{ matrix.artifact-suffix }}.cdx.json

  # CLI publishing remains omitted until the `bibcode` package has its own npm
  # trusted-publisher binding. Configure that binding before restoring the job.

  release:
    name: Publish GitHub Release
    needs: [preflight, build, server_aggregate, server_attest]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.server_aggregate.result == 'success' && needs.server_attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Fork adaptation: publish with the workflow's own GITHUB_TOKEN instead of
    # upstream's release GitHub App (RELEASE_APP_ID/RELEASE_APP_PRIVATE_KEY).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download all desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download complete server release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release-set
          path: release-assets

      - name: Verify signed server release before publication
        run: |
          node scripts/verify-server-artifacts.ts \
            --manifest release-assets/artifacts.json \
            --directory release-assets \
            --public-key packaging/server/server-release.pub \
            --require-complete-matrix

      - id: release_timestamp
        name: Capture release timestamp
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'pub_date=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build Tauri update manifest
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          node scripts/build-tauri-update-manifest.ts \
            --assets-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --pub-date "${{ steps.release_timestamp.outputs.pub_date }}" \
            --notes "${{ needs.preflight.outputs.release_name }}" \
            --output release-assets/latest.json

      - name: Verify Tauri update signatures
        if: needs.preflight.outputs.is_update_candidate == 'true'
        shell: bash
        run: |
          cargo run --locked -p bibcode-updater-verifier -- apps/desktop/src-tauri/tauri.release.conf.json release-assets/latest.json release-assets

      - name: Require inspected stable draft
        if: needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$(git rev-parse HEAD)"

      - name: Prepare stable release assets
        if: needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-assets/updater-*.json
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > expected-assets.txt

      - name: Publish stable release
        if: needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true' && needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          draft: true
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish first stable release
        if: needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true' && needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          draft: true
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        if: needs.preflight.outputs.release_channel == 'nightly' && needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish first nightly release
        if: needs.preflight.outputs.release_channel == 'nightly' && needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify stable draft release assets
        if: needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            LC_ALL=C sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt

      - name: Publish approved stable release
        if: needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_UPDATE_CANDIDATE: ${{ needs.preflight.outputs.is_update_candidate }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          publish_args=(gh release edit "$RELEASE_TAG" --draft=false)
          if [[ "$IS_UPDATE_CANDIDATE" == "true" ]]; then
            publish_args+=(--latest)
          fi
          "${publish_args[@]}"

  # Fork adaptation: upstream's `deploy_web` job (hosted web app on Vercel,
  # hosted web domains) is omitted — it targets a separately configured Vercel project.
  # Configure your own Vercel project and domains before restoring it.

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' && needs.preflight.outputs.publish_requested == 'true' }}
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Fork adaptation: push the version-bump commit with the workflow's own
    # GITHUB_TOKEN instead of upstream's release GitHub App. Note this only
    # works while `main` has no branch protection blocking the token, and the
    # push will not trigger other workflows (GitHub suppresses workflow runs
    # for GITHUB_TOKEN pushes, which also prevents release/deploy loops).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@bibcode/scripts...
              - --filter=@bibcode/oxlint-plugin-bibcode...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json apps/server/Cargo.toml apps/desktop/src-tauri/Cargo.toml Cargo.lock pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json apps/server/Cargo.toml apps/desktop/src-tauri/Cargo.toml Cargo.lock pnpm-lock.yaml
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main

  # Fork adaptation: upstream's `announce_discord` job (Discord release
  # announcements) is omitted — this fork has no Discord server.
